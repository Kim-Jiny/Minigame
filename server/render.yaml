services:
  - type: web
    name: minigame-server
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: minigame-db
          property: connectionString

databases:
  - name: minigame-db
    plan: free
    databaseName: minigame
