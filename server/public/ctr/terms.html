const I18N = {"ko": "<span class=\"badge\">규칙찾기 · CatchTheRule</span>\n  <h1>이용약관</h1>\n  <div class=\"eff\">시행일: 2026년 6월 4일</div>\n\n  <p>본 약관은 규칙찾기(CatchTheRule, 이하 \"앱\")의 이용 조건을 정합니다. 앱을 설치·이용함으로써 이용자는 본 약관에 동의한 것으로 봅니다.</p>\n\n  <h2>제1조 (서비스 내용)</h2>\n  <p>앱은 수열·패턴의 규칙을 찾아 빈칸을 맞히는 단계형 퍼즐 게임과, 타임어택 점수를 등록하는 랭킹 기능을 제공합니다. 회원가입이나 로그인은 필요하지 않습니다.</p>\n\n  <h2>제2조 (이용 요금 및 인앱결제)</h2>\n  <p>앱은 기본적으로 무료로 제공되며, 이용자는 선택적으로 유료 인앱 상품(예: 힌트 묶음)을 구매할 수 있습니다.</p>\n  <ul>\n    <li>모든 인앱 결제는 Apple App Store 또는 Google Play를 통해 처리되며, 가격은 각 스토어에 표시된 금액을 따릅니다. 운영자는 신용카드 등 결제수단 정보를 직접 수집·보관하지 않습니다.</li>\n    <li><b>청약철회·환불</b>: 결제 취소 및 환불은 각 스토어(Apple/Google)의 정책과 절차에 따라 처리됩니다. 다만 힌트 묶음과 같이 구매 즉시 사용 가능한 소비성 디지털 콘텐츠는 이미 사용한 부분에 대해 「전자상거래 등에서의 소비자보호에 관한 법률」 제17조 제2항에 따라 청약철회가 제한될 수 있습니다. 미사용분이거나 서비스의 하자·오류로 인한 경우에는 관련 법령에 따라 환불받을 수 있습니다.</li>\n    <li>미성년자가 법정대리인의 동의 없이 결제한 경우, 본인 또는 법정대리인은 관련 법령에 따라 결제를 취소할 수 있습니다.</li>\n    <li>결제 관련 문의는 고객지원(<a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a>) 또는 해당 스토어 고객센터로 연락해 주세요.</li>\n  </ul>\n\n  <h2>제3조 (이용자의 의무)</h2>\n  <ul>\n    <li>이용자는 부정한 방법(데이터 변조, 자동화 도구, 비정상 요청 등)으로 랭킹 점수를 조작해서는 안 됩니다.</li>\n    <li>타인에게 불쾌감을 주거나 욕설·차별·광고성 문구를 포함한 닉네임을 사용해서는 안 됩니다.</li>\n    <li>서비스의 정상적인 운영을 방해하는 행위를 해서는 안 됩니다.</li>\n  </ul>\n\n  <h2>제4조 (랭킹 운영)</h2>\n  <p>운영자는 부정행위가 확인되거나 부적절한 닉네임이 등록된 경우 사전 통지 없이 해당 랭킹 기록을 삭제하거나 수정할 수 있습니다. 또한 서비스 점검·개선을 위해 랭킹을 초기화하거나 시즌제로 운영할 수 있습니다.</p>\n\n  <h2>제5조 (지식재산권)</h2>\n  <p>앱과 그 콘텐츠(디자인, 문제, 코드 등)에 대한 권리는 운영자에게 있습니다. 이용자는 운영자의 사전 동의 없이 이를 복제·배포·상업적으로 이용할 수 없습니다.</p>\n\n  <h2>제6조 (면책)</h2>\n  <ul>\n    <li>앱은 \"있는 그대로(as-is)\" 제공되며, 특정 목적에의 적합성이나 무중단·무오류를 보장하지 않습니다.</li>\n    <li>천재지변, 통신 장애, 이용자의 기기 환경 등 운영자의 합리적 통제를 벗어난 사유로 인한 손해에 대해 책임지지 않습니다.</li>\n    <li>기기에 저장된 진행도는 앱 삭제·기기 초기화 시 소실될 수 있으며, 운영자는 이를 복구할 의무가 없습니다.</li>\n  </ul>\n\n  <h2>제7조 (서비스의 변경·중단)</h2>\n  <p>운영자는 서비스의 전부 또는 일부를 변경하거나 중단할 수 있으며, 중요한 변경 시 앱 내 또는 본 페이지를 통해 고지합니다.</p>\n\n  <h2>제8조 (준거법 및 분쟁 해결)</h2>\n  <p>본 약관은 대한민국 법령에 따라 해석되며, 서비스 이용과 中断·无错误。</li>\n    <li>对于天灾、通信故障、用户设备环境等超出运营者合理控制范围的事由所导致的损害，运营者概不负责。</li>\n    <li>存储于设备上的进度可能在删除应用·重置设备时丢失，运营者没有恢复的义务。</li>\n  </ul>\n\n  <h2>第7条（服务的变更·中断）</h2>\n  <p>运营者可变更或中断服务的全部或部分，发生重要变更时将通过应用内或本页面进行告知。</p>\n\n  <h2>第8条（准据法及争议解决）</h2>\n  <p>本条款依据大韩民国法令进行解释，与服务使用相关的争议依照相关法令规定的程序处理。</p>\n\n  <h2>第9条（咨询）</h2>\n  <div class=\"card\">\n    <p style=\"margin:0\">咨询：<a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n  </div>\n\n  <footer>发现规律（CatchTheRule） · 本条款自2026年6月4日起适用。</footer>", "es": "<span class=\"badge\">Encuentra la Regla · CatchTheRule</span>\n  <h1>Términos de servicio</h1>\n  <div class=\"eff\">Fecha de entrada en vigor: 4 de junio de 2026</div>\n\n  <p>Estos términos establecen las condiciones de uso de Encuentra la Regla (CatchTheRule, en adelante, la \"app\"). Al instalar y utilizar la app, se considera que el usuario acepta estos términos.</p>\n\n  <h2>Artículo 1 (Descripción del servicio)</h2>\n  <p>La app ofrece un juego de rompecabezas por niveles en el que se descubren las reglas de secuencias y patrones para completar los espacios en blanco, así como una función de clasificación para registrar las puntuaciones del modo contrarreloj. No es necesario registrarse ni iniciar sesión.</p>\n\n  <h2>Artículo 2 (Tarifas de uso y compras dentro de la app)</h2>\n  <p>La app se ofrece de forma gratuita por defecto, y los usuarios pueden adquirir opcionalmente artículos de pago dentro de la app (p. ej., paquetes de pistas).</p>\n  <ul>\n    <li>Todas las compras dentro de la app se procesan a través de Apple App Store o Google Play, y los precios siguen los importes mostrados en cada tienda. El operador no recopila ni almacena directamente información de medios de pago como números de tarjeta de crédito.</li>\n    <li><b>Desistimiento y reembolsos</b>: Las cancelaciones y los reembolsos se gestionan conforme a las políticas y procedimientos de cada tienda (Apple/Google). No obstante, en el caso de contenido digital consumible que puede usarse de ción de responsabilidad)</h2>\n  <ul>\n    <li>La app se proporciona \"tal cual (as-is)\" y no se garantiza su idoneidad para un fin determinado ni un funcionamiento ininterrumpido o libre de errores.</li>\n    <li>El operador no se hace responsable de los daños derivados de causas ajenas a su control razonable, como casos de fuerza mayor, fallos de comunicación o el entorno del dispositivo del usuario.</li>\n    <li>El progreso almacenado en el dispositivo puede perderse al desinstalar la app o restablecer el dispositivo, y el operador no tiene obligación de recuperarlo.</li>\n  </ul>\n\n  <h2>Artículo 7 (Modificación o suspensión del servicio)</h2>\n  <p>El operador podrá modificar o suspender la totalidad o parte del servicio y, en caso de cambios importantes, lo notificará dentro de la app o a través de esta página.</p>\n\n  <h2>Artículo 8 (Legislación aplicable y resolución de conflictos)</h2>\n  <p>Estos términos se interpretarán de conformidad con la legislación de la República de Corea, y los conflictos relacionados con el uso del servicio se resolverán conforme a los procedimientos establecidos por la legislación aplicable.</p>\n\n  <h2>Artículo 9 (Contacto)</h2>\n  <div class=\"card\">\n    <p style=\"margin:0\">Consultas: <a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n  </div>\n\n  <footer>Encuentra la Regla (CatchTheRule) · Estos términos se aplican a partir del 4 de junio de 2026.</footer>", "fr": "<span class=\"badge\">Trouve le Motif · CatchTheRule</span>\n  <h1>Conditions d'utilisation</h1>\n  <div class=\"eff\">Date d'entrée en vigueur : 4 juin 2026</div>\n\n  <p>Les présentes conditions définissent les modalités d'utilisation de Trouve le Motif (CatchTheRule, ci-après « l'application »). En installant et en utilisant l'application, l'utilisateur est réputé avoir accepté les présentes conditions.</p>\n\n  <h2>Article 1 (Description du service)</h2>\n  <p>L'application propose un jeu de puzzle par étapes consistant à trouver la règle d'une suite ou d'un motif pour compléter les cases vides, ainsi qu'une fonction de classement permettant d'enregistrer les scores de contre-la-montre. Aucune inscription ni connexion n'est nécessaire.</p>\n\n  <h2>Article 2 (Tarifs d'utilisation et achats intégrés)</h2>\n  <p>L'application est fournie gratuitement par défaut, et les utilisateurs peuvent éventuellement acheter des articles payants intégrés (par exemple, des packs d'indices).</p>\n  <ul>\n    <li>Tous les achats intégrés sont traités via l'Apple App Store ou Google Play, et les prix correspondent aux montants affichés dans chaque boutique. L'exploitant ne collecte ni ne conserve directement les informations de moyens de paiement telles que les numéros de carte bancaire.</li>\n    <li><b>Rétractation et remboursements</b> : Les annulations et les remboursements sont traités conformément aux politiques et procédures de chaque boutique (Apple/Google). Toutefois, pour un contenu numérique consommable utilisable immédiatement après l'achat, comme les packs d'indices, le droit de rétractation peut être limité pour la partie déjà utilisée, conformément à l'article 17(2) de la loi sur la protection des consommateurs dans le commerce électronique de la République de Corée. Les remboursements restent possibles pour les articles non utilisés ou en cas de défaut ou d'erreur du service, conformément à la législation applicable.</li>\n    <li>Si un mineur effectue un achat sans le consentement de son représentant légal, le mineur ou son représentant peut l'annuler conformément à la législation applicable.</li>\n    <li>Pour toute question relative au paiement, veuillez contacter l'assistance (<a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a>) ou le service client de la boutique concernée.</li>\n  </ul>\n\n  <h2>Article 3 (Obligations de l'utilisateur)</h2>\n  <ul>\n    <li>L'utilisateur ne doit pas manipuler les scores du classement par des moyens frauduleux (altération des données, outils d'automatisation, requêtes anormales, etc.).</li>\n    <li>L'utilisateur ne doit pas utiliser de pseudonyme qui incommode autrui ou qui contient des insultes, des propos discriminatoires ou des messages publicitaires.</li>\n    <li>L'utilisateur ne doit pas se livrer à des actes entravant le fonctionnement normal du service.</li>\n  </ul>\n\n  <h2>Article 4 (Gestion du classement)</h2>\n  <p>L'exploitant peut, sans préavis, supprimer ou modifier un enregistrement du classement en cas de fraude avérée ou d'enregistrement d'un pseudonyme inapproprié. Il peut également réinitialiser le classement ou l'exploiter par saisons à des fins de maintenance ou d'amélioration du service.</p>\n\n  <h2>Article 5 (Propriété intellectuelle)</h2>\n  <p>Les droits relatifs à l'application et à son contenu (design, énigmes, code, etc.) appartiennent à l'exploitant. L'utilisateur ne peut les reproduire, les distribuer ni les exploiter commercialement sans l'accord préalable de l'exploitant.</p>\n\n  <h2>Article 6 (Limitation de responsabilité)</h2>\n  <ul>\n    <li>L'application est fournie « en l'état (as-is) » et ne garantit ni l'adéquation à un usage particulier, ni l'absence d'interruption ou d'erreur.</li>\n    <li>L'exploitant n'est pas responsable des dommages résultant de causes échappant à son contrôle raisonnable, telles que les cas de force majeure, les pannes de communication ou l'environnement de l'appareil de l'utilisateur.</li>\n    <li>La progression stockée sur l'appareil peut être perdue lors de la désinstallation de l'application ou de la réinitialisation de l'appareil, et l'exploitant n'a aucune obligation de la restaurer.</li>\n  </ul>\n\n  <h2>Article 7 (Modification ou interruption du service)</h2>\n  <p>L'exploitant peut modifier ou interrompre tout ou partie du service ; en cas de modification importante, il en informe l'utilisateur au sein de l'application ou via cette page.</p>\n\n  <h2>Article 8 (Droit applicable et règlement des litiges)</h2>\n  <p>Les présentes conditions sont interprétées conformément à la législation de la République de Corée, et tout litige lié à l'utilisation du service est soumis aux procédures prévues par la législation applicable.</p>\n\n  <h2>Article 9 (Contact)</h2>\n  <div class=\"card\">\n    <p style=\"margin:0\">Contact : <a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n  </div>\n\n  <footer>Trouve le Motif (CatchTheRule) · Les présentes conditions s'appliquent à compter du 4 juin 2026.</footer>", "de": "<span class=\"badge\">Finde die Regel · CatchTheRule</span>\n  <h1>Nutzungsbedingungen</h1>\n  <div class=\"eff\">Inkrafttreten: 4. Juni 2026</div>\n\n  <p>Diese Bedingungen regeln die Nutzungsbedingungen von Finde die Regel (CatchTheRule, nachfolgend \"App\"). Durch die Installation und Nutzung der App gelten diese Bedingungen als vom Nutzer akzeptiert.</p>\n\n  <h2>§1 (Leistungsbeschreibung)</h2>\n  <p>Die App bietet ein stufenweises Rätselspiel, bei dem die Regel von Zahlenfolgen und Mustern erkannt und die Lücken ausgefüllt werden müssen, sowie eine Ranglistenfunktion zum Eintragen von Time-Attack-Punktzahlen. Eine Registrierung oder Anmeldung ist nicht erforderlich.</p>\n\n  <h2>§2 (Nutzungsentgelt und In-App-Käufe)</h2>\n  <p>Die App wird grundsätzlich kostenlos bereitgestellt; Nutzer können optional kostenpflichtige In-App-Artikel (z. B. Tipp-Pakete) erwerben.</p>\n  <ul>\n    <li>Alle In-App-Käufe werden über den Apple App Store oder Google Play abgewickelt, und die Preise richten sich nach den in den jeweiligen Stores angezeigten Beträgen. Der Betreiber erhebt oder speichert keine Zahlungsmittelinformationen wie Kreditkartennummern direkt.</li>\n    <li><b>Widerruf &amp; Erstattung</b>: Stornierungen und Erstattungen werden gemäß den Richtlinien und Verfahren des jeweiligen Stores (Apple/Google) abgewickelt. Bei verbrauchbaren digitalen Inhalten, die unmittelbar nach dem Kauf nutzbar sind, wie z. B. Tipp-Paketen, kann das Widerrufsrecht für den bereits genutzten Teil gemäß Artikel 17 A const NAMES = {"en": "English", "ko": "한국어", "ja": "日本語", "zh": "简体中文", "es": "Español", "fr": "Français", "de": "Deutsch"};
function pickLang() {
  const q = new URLSearchParams(location.search).get('lang');
  const cand = (q || navigator.language || 'en').toLowerCase();
  const code = cand.startsWith('zh') ? 'zh' : cand.slice(0, 2);
  return I18N[code] ? code : 'en';
}
let cur = pickLang();
const sel = document.getElementById('lang');
Object.keys(NAMES).forEach(c => {
  const o = document.createElement('option');
  o.value = c; o.textContent = NAMES[c];
  sel.appendChild(o);
});
function render() {
  document.getElementById('content').innerHTML = I18N[cur];
  document.documentElement.lang = (cur === 'zh') ? 'zh-Hans' : cur;
  sel.value = cur;
}
sel.addEventListener('change', e => {
  cur = e.target.value; render();
  const u = new URL(location); u.searchParams.set('lang', cur);
  history.replaceState(null, '', u);
});
render();
</script>
