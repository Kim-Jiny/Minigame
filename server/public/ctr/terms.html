lar y utilizar la app, se considera que el usuario acepta estos términos.</p>\n\n  <h2>Artículo 1 (Descripción del servicio)</h2>\n  <p>La app ofrece un juego de rompecabezas por niveles en el que se descubren las reglas de secuencias y patrones para completar los espacios en blanco, así como una función de clasificación para registrar las puntuaciones del modo contrarreloj. No es necesario registrarse ni iniciar sesión.</p>\n\n  <h2>Artículo 2 (Tarifas de uso)</h2>\n  <p>La app se ofrece de forma gratuita. En caso de que en el futuro se añadan elementos de pago (p. ej., eliminación de publicidad), se notificará por separado.</p>\n\n  <h2>Artículo 3 (Obligaciones del usuario)</h2>\n  <ul>\n    <li>El usuario no debe manipular las puntuaciones de la clasificación por medios fraudulentos (alteración de datos, herramientas automatizadas, solicitudes anómalas, etc.).</li>\n    <li>El usuario no debe utilizar apodos que resulten ofensivos para otras personas o que contengan insultos, contenido discriminatorio o publicitario.</li>\n    <li>El usuario no debe realizar actos que obstaculicen el funcionamiento normal del servicio.</li>\n  </ul>\n\n  <h2>Artículo 4 (Gestión de la clasificación)</h2>\n  <p>El operador podrá eliminar o modificar los registros de la clasificación sin previo aviso cuando se constate un fraude o se haya registrado un apodo inapropiado. Asimismo, podrá restablecer la clasificación u operarla por temporadas con fines de mantenimiento y mejora del servicio.</p>\n\n  <h2>Artículo 5 (Propiedad intelectual)</h2>\n  <p>Los derechos sobre la app y su contenido (diseño, problemas, código, etc.) pertenecen al operador. El usuario no podrá reproducirlos, distribuirlos ni utilizarlos con fines comerciales sin el consentimiento previo del operador.</p>\n\n  <h2>Artículo 6 (Exención de responsabilidad)</h2>\n  <ul>\n    <li>La app se proporciona \"tal cual (as-is)\" y no se garantiza su idoneidad para un fin determinado ni un funcionamiento ininterrumpido o lib ls, anomale Anfragen usw.) manipulieren.</li>\n    <li>Es dürfen keine Spitznamen verwendet werden, die andere belästigen oder Beleidigungen, Diskriminierungen oder werbliche Inhalte enthalten.</li>\n    <li>Handlungen, die den ordnungsgemäßen Betrieb des Dienstes beeinträchtigen, sind untersagt.</li>\n  </ul>\n\n  <h2>§4 (Betrieb der Rangliste)</h2>\n  <p>Der Betreiber kann den betreffenden Ranglisteneintrag ohne vorherige Ankündigung löschen oder ändern, wenn ein Betrug festgestellt wird oder ein unangemessener Spitzname eingetragen wurde. Darüber hinaus kann der Betreiber die Rangliste zur Wartung und Verbesserung des Dienstes zurücksetzen oder als Saisonsystem betreiben.</p>\n\n  <h2>§5 (Geistiges Eigentum)</h2>\n  <p>Die Rechte an der App und ihren Inhalten (Design, Aufgaben, Code usw.) liegen beim Betreiber. Der Nutzer darf diese ohne vorherige Zustimmung des Betreibers nicht vervielfältigen, verbreiten oder kommerziell nutzen.</p>\n\n  <h2>§6 (Haftungsausschluss)</h2>\n  <ul>\n    <li>Die App wird \"wie besehen (as-is)\" bereitgestellt; es wird keine Eignung für einen bestimmten Zweck und keine unterbrechungs- oder fehlerfreie Bereitstellung gewährleistet.</li>\n    <li>Für Schäden aufgrund von Ursachen, die sich der angemessenen Kontrolle des Betreibers entziehen, wie höhere Gewalt, Kommunikationsstörungen oder die Geräteumgebung des Nutzers, wird keine Haftung übernommen.</li>\n    <li>Der auf dem Gerät gespeicherte Fortschritt kann beim Deinstallieren der App oder beim Zurücksetzen des Geräts verloren gehen; der Betreiber ist nicht zur Wiederherstellung verpflichtet.</li>\n  </ul>\n\n  <h2>§7 (Änderung und Einstellung des Dienstes)</h2>\n  <p>Der Betreiber kann den Dienst ganz oder teilweise ändern oder einstellen und teilt wesentliche Änderungen in der App oder auf dieser Seite mit.</p>\n\n  <h2>§8 (Anwendbares Recht und Streitbeilegung)</h2>\n  <p>Diese Bedingungen werden nach den Gesetzen der Republik Korea ausgelegt; Streitigkeiten im Zusammenhang mit const NAMES = {"en": "English", "ko": "한국어", "ja": "日本語", "zh": "简体中文", "es": "Español", "fr": "Français", "de": "Deutsch"};
function pickLang() {
  const q = new URLSearchParams(location.search).get('lang');
  const cand = (q || navigator.language || 'en').toLowerCase();
  const code = cand.startsWith('zh') ? 'zh' : cand.slice(0, 2);
  return I18N[code] ? code : 'en';
}
let cur = pickLang();
const sel = document.getElementById('lang');
Object.keys(NAMES).forEach(c => {
  const o = document.createElement('option');
  o.value = c; o.textContent = NAMES[c];
  sel.appendChild(o);
});
function render() {
  document.getElementById('content').innerHTML = I18N[cur];
  document.documentElement.lang = (cur === 'zh') ? 'zh-Hans' : cur;
  sel.value = cur;
}
sel.addEventListener('change', e => {
  cur = e.target.value; render();
  const u = new URL(location); u.searchParams.set('lang', cur);
  history.replaceState(null, '', u);
});
render();
</script>
