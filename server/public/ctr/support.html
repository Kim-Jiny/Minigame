<tr><th>Email</th><td><a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></td></tr>\n    </table>\n  </div>\n\n  <footer>Catch the Rule (CatchTheRule) · Support</footer>", "ja": "<span class=\"badge\">ルールを探せ · CatchTheRule</span>\n  <h1>カスタマーサポート</h1>\n  <p>ルールを探せ(CatchTheRule)をご利用いただきありがとうございます。ご不明な点やお困りのことがございましたら、以下の方法でお問い合わせください。</p>\n\n  <h2>お問い合わせ</h2>\n  <div class=\"card\">\n    <p style=\"margin:0 0 6px\">メール: <a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n    <p style=\"margin:0\">アプリ内の<b>設定 &gt; お問い合わせ</b>からもお問い合わせを送信し、回答を確認できます。通常、営業日ベースで2〜3日以内にご回答いたします。</p>\n  </div>\n\n  <h2>よくある質問</h2>\n  <div class=\"card\">\n    <p style=\"margin:0 0 4px\"><b>Q. タイムアタックのスコアがランキングに表示されません。</b></p>\n    <p style=\"margin:0 0 16px\">インターネット接続を確認したうえで、タイムアタック終了画面でニックネームを入力し、スコアを登録してください。</p>\n    <p style=\"margin:0 0 4px\"><b>Q. ゲームの進行記録が消えてしまいました。</b></p>\n    <p style=\"margin:0 0 16px\">進行度・星・設定は端末内にのみ保存されるため、アプリを削除したり端末を初期化したりすると消えてしまう場合があります。</p>\n    <p style=\"margin:0 0 4px\"><b>Q. 送信したお問い合わせの回答はどこで確認できますか？</b></p>\n    <p style=\"margin:0\">アプリの<b>設定 &gt; お問い合わせ</b>画面で、送信したお問い合わせと運営者からの回答を確認できます。</p>\n  </div>\n\n  <h2>決済・返金</h2>\n  <div class=\"card\">\n    <p style=\"margin:0 0 4px\"><b>Q. ヒントの購入を返金してほしいです。</b></p>\n    <p style=\"margin:0\">アプリ内課金の返金は、購入されたストアを通じて行われます。<b>App Store</b> は reportaproblem.apple.com、<b>Google Play</b> は Play ストア &gt; メニュー &gt; 注文履歴から返金を申請できます。ヒントのようにすでに使用した消費性アイテムは返金が制限される場合があります。詳しくは上記のメールへお問い合わせください。</p>\n  </div>\n\n  <h2>運営者情報</h2>\n  <div class=\"card\">\n    <table>\n      <tr><th>商号</th><td>진소프트</td></tr>\n      <tr><th>事業者登録番号</th><td>827-53-01093</td></tr>\n      <tr><th>通信販売業申告番号</th><td>2026-고양덕양구-0658</td></tr>\n      <tr><th>所在地</th><td>경기도 덕양구 충경로 138, 303동 508호</td></tr>\n      <tr><th>メール</th><td><a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></td></tr>\n    </table>\n  </div>\n\n  <footer>ルールを探せ(CatchTheRule) · カスタマーサポート</footer>", "zh": "<span class=\"badge\">发现规律 · CatchTheRule</s desde <b>Ajustes &gt; Contacto</b> dentro de la app. Normalmente respondemos en un plazo de 2 a 3 días hábiles.</p>\n  </div>\n\n  <h2>Preguntas frecuentes</h2>\n  <div class=\"card\">\n    <p style=\"margin:0 0 4px\"><b>P. Mi puntuación de Contrarreloj no aparece en el ranking.</b></p>\n    <p style=\"margin:0 0 16px\">Comprueba tu conexión a internet y, en la pantalla de fin de Contrarreloj, introduce tu apodo y registra tu puntuación.</p>\n    <p style=\"margin:0 0 4px\"><b>P. Mi historial de progreso del juego ha desaparecido.</b></p>\n    <p style=\"margin:0 0 16px\">El progreso, las estrellas y los ajustes se guardan únicamente en el dispositivo, por lo que pueden perderse si desinstalas la app o restableces el dispositivo.</p>\n    <p style=\"margin:0 0 4px\"><b>P. ¿Dónde puedo ver la respuesta a la consulta que envié?</b></p>\n    <p style=\"margin:0\">Puedes ver las consultas enviadas y las respuestas del operador en la pantalla <b>Ajustes &gt; Contacto</b> de la app.</p>\n  </div>\n\n  <h2>Pagos y reembolsos</h2>\n  <div class=\"card\">\n    <p style=\"margin:0 0 4px\"><b>P. Quiero un reembolso de una compra de pistas.</b></p>\n    <p style=\"margin:0\">Los reembolsos de las compras dentro de la app se gestionan a través de la tienda donde realizaste la compra. Para la <b>App Store</b>, usa reportaproblem.apple.com; para <b>Google Play</b>, ve a Play Store &gt; Menú &gt; Historial de pedidos para solicitar el reembolso. Los artículos consumibles ya utilizados, como las pistas, pueden no ser reembolsables. Para más detalles, contáctanos en el correo indicado arriba.</p>\n  </div>\n\n  <h2>Información del operador</h2>\n  <div class=\"card\">\n    <table>\n      <tr><th>Razón social</th><td>진소프트</td></tr>\n      <tr><th>N.º de registro mercantil</th><td>827-53-01093</td></tr>\n      <tr><th>N.º de registro de venta en línea</th><td>2026-고양덕양구-0658</td></tr>\n      <tr><th>Dirección</th><td>경기도 덕양구 충경로 138, 303동 508호</td></tr>\n      <tr><th>Correo electrónic App Store</b>, utilisez reportaproblem.apple.com ; pour <b>Google Play</b>, accédez à Play Store &gt; Menu &gt; Historique des commandes pour demander un remboursement. Les articles consommables déjà utilisés, comme les indices, peuvent ne pas être remboursables. Pour plus de détails, contactez-nous à l'adresse e-mail ci-dessus.</p>\n  </div>\n\n  <h2>Informations sur l'exploitant</h2>\n  <div class=\"card\">\n    <table>\n      <tr><th>Raison sociale</th><td>진소프트</td></tr>\n      <tr><th>N° d'enregistrement d'entreprise</th><td>827-53-01093</td></tr>\n      <tr><th>N° de déclaration de vente en ligne</th><td>2026-고양덕양구-0658</td></tr>\n      <tr><th>Adresse</th><td>경기도 덕양구 충경로 138, 303동 508호</td></tr>\n      <tr><th>E-mail</th><td><a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></td></tr>\n    </table>\n  </div>\n\n  <footer>Trouve le Motif (CatchTheRule) · Assistance</footer>", "de": "<span class=\"badge\">Finde die Regel · CatchTheRule</span>\n  <h1>Support</h1>\n  <p>Vielen Dank, dass Sie Finde die Regel (CatchTheRule) nutzen. Bei Fragen oder wenn Sie Hilfe benötigen, kontaktieren Sie uns bitte über die folgenden Möglichkeiten.</p>\n\n  <h2>Kontakt</h2>\n  <div class=\"card\">\n    <p style=\"margin:0 0 6px\">E-Mail: <a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n    <p style=\"margin:0\">Sie können Ihre Anfrage auch in der App unter <b>Einstellungen &gt; Kontakt</b> hinterlassen und die Antwort dort einsehen. In der Regel antworten wir innerhalb von 2 bis 3 Werktagen.</p>\n  </div>\n\n  <h2>Häufige Fragen</h2>\n  <div class=\"card\">\n    <p style=\"margin:0 0 4px\"><b>F. Mein Time-Attack-Punktestand wird nicht in der Rangliste angezeigt.</b></p>\n    <p style=\"margin:0 0 16px\">Bitte überprüfen Sie Ihre Internetverbindung, geben Sie auf dem Abschlussbildschirm des Time-Attack-Modus einen Spitznamen ein und reichen Sie Ihren Punktestand ein.</p>\n    <p style=\"margin:0 0 4px\"><b>F. Mein Spielfortschritt ist verschwunden.</b></p>\n    <p style=\"margin:0 0 16px\">Fortschritt, Sterne und Einstellungen werden nur auf dem Gerät gespeichert. Beim Löschen der App oder beim Zurücksetzen des Geräts können sie daher verloren gehen.</p>\n    <p style=\"margin:0 0 4px\"><b>F. Wo sehe ich die Antwort auf meine gesendete Anfrage?</b></p>\n    <p style=\"margin:0\">Auf dem Bildschirm <b>Einstellungen &gt; Kontakt</b> in der App können Sie Ihre gesendeten Anfragen und die Antworten des Betreibers einsehen.</p>\n  </div>\n\n  <h2>Zahlungen &amp; Erstattungen</h2>\n  <div class=\"card\">\n    <p style=\"margin:0 0 4px\"><b>F. Ich möchte eine Erstattung für einen Tipp-Kauf.</b></p>\n    <p style=\"margin:0\">Erstattungen für In-App-Käufe werden über den Store abgewickelt, in dem Sie gekauft haben. Für den <b>App Store</b> verwenden Sie reportaproblem.apple.com; für <b>Google Play</b> gehen Sie zu Play Store &gt; Menü &gt; Bestellverlauf, um eine Erstattung zu beantragen. Bereits genutzte verbrauchbare Artikel wie Tipps sind möglicherweise nicht erstattungsfähig. Für Details kontaktieren Sie uns bitte über die oben genannte E-Mail.</p>\n  </div>\n\n  <h2>Betreiberangaben</h2>\n  <div class=\"card\">\n    <table>\n      <tr><th>Firmenname</th><td>진소프트</td></tr>\n      <tr><th>Steuernummer (Gewerbe)</th><td>827-53-01093</td></tr>\n      <tr><th>Fernabsatz-Meldenummer</th><td>2026-고양덕양구-0658</td></tr>\n      <tr><th>Adresse</th><td>경기도 덕양구 충경로 138, 303동 508호</td></tr>\n      <tr><th>E-Mail</th><td><a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></td></tr>\n    </table>\n  </div>\n\n  <footer>Finde die Regel (CatchTheRule) · Support</footer>"};
const NAMES = {"en": "English", "ko": "한국어", "ja": "日本語", "zh": "简体中文", "es": "Español", "fr": "Français", "de": "Deutsch"};
function pickLang(){const q=new URLSearchParams(location.search).get("lang");const cand=(q||navigator.language||"en").toLowerCase();const code=cand.startsWith("zh")?"zh":cand.slice(0,2);return I18N[code]?code:"en";}
let cur=pickLang();const sel=document.getElementById("lang");Object.keys(NAMES).forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=NAMES[c];sel.appendChild(o);});
function render(){document.getElementById("content").innerHTML=I18N[cur];document.documentElement.lang=(cur==="zh")?"zh-Hans":cur;sel.value=cur;}
sel.addEventListener("change",e=>{cur=e.target.value;render();const u=new URL(location);u.searchParams.set("lang",cur);history.replaceState(null,"",u);});
