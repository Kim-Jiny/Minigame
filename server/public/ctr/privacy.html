<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catch the Rule</title>
<style>
  :root {
    --bg: #0E1116; --card: #1B212B; --stroke: rgba(255,255,255,.07);
    --text: #FFFFFF; --sub: rgba(255,255,255,.62); --tert: rgba(255,255,255,.34);
    --accent: #7C5CFF; --accent2: #39E5C8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  .badge {
    display: inline-block; font-size: 13px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    padding: 6px 14px; border-radius: 999px; margin-bottom: 16px;
  }
  h1 { font-size: 26px; margin: 0 0 6px; font-weight: 800; }
  .eff { color: var(--tert); font-size: 14px; margin-bottom: 28px; }
  h2 { font-size: 18px; margin: 32px 0 10px; font-weight: 700; }
  p, li { color: var(--sub); font-size: 15px; }
  ul { padding-left: 20px; }
  a { color: var(--accent2); }
  .card {
    background: var(--card); border: 1px solid var(--stroke);
    border-radius: 16px; padding: 16px 20px; margin: 16px 0;
  }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--stroke); color: var(--sub); vertical-align: top; }
  th { color: var(--text); font-weight: 600; }
  footer { color: var(--tert); font-size: 13px; margin-top: 40px; border-top: 1px solid var(--stroke); padding-top: 20px; }
  .langbar { display:flex; justify-content:flex-end; margin-bottom: 18px; }
  .langbar select {
    background: var(--card); color: var(--text); border: 1px solid var(--stroke);
    border-radius: 10px; padding: 8px 12px; font-size: 14px; font-family: inherit;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar"><select id="lang" aria-label="Language"></select></div>
  <div id="content"></div>
</div>
<script>
const I18N = {"ko": "<span class=\"badge\">규칙찾기 · CatchTheRule</span>\n  <h1>개인정보처리방침</h1>\n  <div class=\"eff\">시행일: 2026년 6월 5일</div>\n\n  <p>규칙찾기(CatchTheRule, 이하 \"앱\")는 이용자의 개인정보를 소중히 다루며, 최소한의 정보만 수집합니다. 본 앱은 별도의 회원가입이나 로그인이 없으며, 대부분의 데이터는 이용자의 기기에만 저장됩니다.</p>\n\n  <h2>1. 수집하는 정보와 목적</h2>\n  <p>앱은 다음 경우에만 정보를 수집·전송합니다.</p>\n  <div class=\"card\">\n    <table>\n      <tr><th>항목</th><th>수집 시점</th><th>목적</th></tr>\n      <tr><td>닉네임</td><td>이용자가 랭킹에 점수를 등록할 때</td><td>랭킹 표시</td></tr>\n      <tr><td>점수·게임 모드</td><td>랭킹 점수 등록 시</td><td>순위 산정</td></tr>\n      <tr><td>임의 기기 식별자<br>(앱이 생성한 UUID)</td><td>랭킹 점수 등록 시</td><td>기기당 최고 점수 유지(중복 방지)</td></tr>\n      <tr><td>국가 코드<br>(예: KR — 기기 지역설정 기반)</td><td>랭킹 점수 등록 시</td><td>랭킹에 국기 표시</td></tr>\n      <tr><td>문의 내용·닉네임</td><td>문의하기 작성·전송 시</td><td>문의 접수 및 답변</td></tr>\n      <tr><td>임의 기기 식별자·앱/OS 버전·국가 코드·실행 정보</td><td>앱 실행 시(이용 통계)</td><td>중복 없는 이용자 수 집계 및 서비스 개선</td></tr>\n    </table>\n  </div>\n  <p>위 \"임의 기기 식별자\"는 앱이 무작위로 생성한 값으로, 기기의 실제 고유번호(IMEI, 광고 식별자 등)나 이용자를 특정할 수 있는 정보가 아닙니다. 앱 실행 시 수집되는 이용 통계는 이 식별자를 기준으로 한 익명 집계(이용자 수·재방문 등)에만 사용되며, 개인을 식별하지 않습니다.</p>\n\n  <h2>2. 기기에만 저장되는 정보(서버로 전송하지 않음)</h2>\n  <ul>\n    <li>게임 진행도, 획득한 별, 힌트 잔여 수</li>\n    <li>닉네임, 사운드·햅틱 등 설정값</li>\n  </ul>\n  <p>이 정보들은 기기의 로컬 저장소(iOS UserDefaults / Android SharedPreferences)에만 보관되며, 앱을 삭제하면 함께 삭제됩니다.</p>\n\n  <h2>3. 수집하지 않는 정보</h2>\n  <ul>\n    <li>이름, 이메일, 전화번호, 주소 등 신원 정보</li>\n    <li>연락처, 사진, 위치(GPS), 마이크 등 기기 권한 정보</li>\n    <li>실제 기기 고유 식별자 및 광고 식별자</li>\n  </ul>\n\n  <h2>4. 보유 및 이용 기간</h2>\n  <p>랭킹에 등록된 닉네임·점수·국가 코드, 문의 내용, 이용 통계 정보는 서비스 제공·운영을 위해 보관됩니다. 이용자가 삭제를 요청하면 해당 기록을 지체 없이 삭제합니다.</p>\n\n  <h2>5. 제3자 제공 및 처리 위탁</h2>\n  <p>앱은 수집한 정보를 제3자에게 판매하거나 제공하지 않습니다. 수집된 데이터는 서비스 운영을 위한 자체 서버(duo.jiny.shop)에 저장됩니다.</p>\n\n  <h2>6. 광고</h2>\n  <p>현재 버전은 광고를 포함하지 않습니다. 향후 광고가 도입될 경우 본 방침을 갱신하고 앱 내에 고지합니다.</p>\n\n  <h2>7. 아동의 개인정보</h2>\n  <p>앱은 만 14세 미만 아동을 포함한 일반 이용자를 대상으로 하며, 아동으로부터 의도적으로 개인정보를 수집하지 않습니다.</p>\n\n  <h2>8. 이용자의 권리</h2>\n  <p>이용자는 언제든지 자신의 랭킹 기록·문의 내역의 삭제를 요청할 수 있으며, 앱 설정의 \"진행도 초기화\"로 기기 내 저장 데이터를 삭제할 수 있습니다.</p>\n\n  <h2>9. 문의처</h2>\n  <div class=\"card\">\n    <p style=\"margin:0\">개인정보 관련 문의: <a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n  </div>\n\n  <h2>10. 방침의 변경</h2>\n  <p>본 방침이 변경될 경우 시행일을 갱신하여 본 페이지에 게시합니다.</p>\n\n  <footer>규칙찾기(CatchTheRule) · 본 방침은 2026년 6월 5일부터 적용됩니다.</footer>", "en": "<span class=\"badge\">Catch the Rule · CatchTheRule</span>\n  <h1>Privacy Policy</h1>\n  <div class=\"eff\">Effective date: June 5, 2026</div>\n\n  <p>Catch the Rule (CatchTheRule, hereinafter the \"App\") values your privacy and collects only the minimum information necessary. The App does not require any separate sign-up or login, and most data is stored solely on your device.</p>\n\n  <h2>1. Information We Collect and Why</h2>\n  <p>The App collects and transmits information only in the following cases.</p>\n  <div class=\"card\">\n    <table>\n      <tr><th>Item</th><th>When Collected</th><th>Purpose</th></tr>\n      <tr><td>Nickname</td><td>When you submit a score to the rankings</td><td>To display rankings</td></tr>\n      <tr><td>Score and game mode</td><td>When submitting a ranking score</td><td>To calculate rankings</td></tr>\n      <tr><td>Random device identifier<br>(a UUID generated by the App)</td><td>When submitting a ranking score</td><td>To keep the highest score per device (prevent duplicates)</td></tr>\n      <tr><td>Country code<br>(e.g., KR — based on device region settings)</td><td>When submitting a ranking score</td><td>To display the flag in rankings</td></tr>\n      <tr><td>Inquiry content and nickname</td><td>When you write and send an inquiry</td><td>To receive and respond to inquiries</td></tr>\n      <tr><td>Random device identifier, app/OS version, country code, and launch information</td><td>When the App is launched (usage statistics)</td><td>To count unique users and improve the service</td></tr>\n    </table>\n  </div>\n  <p>The \"random device identifier\" above is a randomly generated value created by the App; it is not the device's actual unique number (such as IMEI or an advertising identifier) or any information that can identify you. The usage statistics collected when the App is launched are used only for anonymous aggregation based on this identifier (such as user counts and return visits) and do not identify any individual.</p>\n\n  <h2>2. Information Stored Only on Your Device (Not Sent to Our Servers)</h2>\n  <ul>\n    <li>Game progress, stars earned, and remaining hints</li>\n    <li>Nickname and settings such as sound and haptics</li>\n  </ul>\n  <p>This information is kept only in your device's local storage (iOS UserDefaults / Android SharedPreferences) and is deleted along with the App when you uninstall it.</p>\n\n  <h2>3. Information We Do Not Collect</h2>\n  <ul>\n    <li>Identity information such as name, email, phone number, or address</li>\n    <li>Device permission data such as contacts, photos, location (GPS), or microphone</li>\n    <li>The device's actual unique identifier and advertising identifier</li>\n  </ul>\n\n  <h2>4. Retention and Use Period</h2>\n  <p>The nickname, score, and country code registered in the rankings, inquiry content, and usage statistics are retained to provide and operate the service. If you request deletion, we will delete the relevant records without delay.</p>\n\n  <h2>5. Provision to Third Parties and Outsourcing of Processing</h2>\n  <p>The App does not sell or provide the collected information to third parties. The collected data is stored on our own server (duo.jiny.shop) used to operate the service.</p>\n\n  <h2>6. Advertising</h2>\n  <p>The current version does not include advertising. If advertising is introduced in the future, we will update this policy and provide notice within the App.</p>\n\n  <h2>7. Children's Personal Information</h2>\n  <p>The App is intended for general users, including children under the age of 14, and does not intentionally collect personal information from children.</p>\n\n  <h2>8. Your Rights</h2>\n  <p>You may request deletion of your ranking records and inquiry history at any time, and you can delete the data stored on your device using \"Reset Progress\" in the App settings.</p>\n\n  <h2>9. Contact</h2>\n  <div class=\"card\">\n    <p style=\"margin:0\">Privacy inquiries: <a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n  </div>\n\n  <h2>10. Changes to This Policy</h2>\n  <p>If this policy is changed, we will update the effective date and post it on this page.</p>\n\n  <footer>Catch the Rule (CatchTheRule) · This policy is effective as of June 5, 2026.</footer>", "ja": "<span class=\"badge\">ルールを探せ · CatchTheRule</span>\n  <h1>プライバシーポリシー</h1>\n  <div class=\"eff\">施行日: 2026年6月5日</div>\n\n  <p>ルールを探せ（CatchTheRule、以下「本アプリ」）は、利用者の個人情報を大切に取り扱い、必要最小限の情報のみを収集します。本アプリには別途の会員登録やログインはなく、ほとんどのデータは利用者の端末内にのみ保存されます。</p>\n\n  <h2>1. 収集する情報と目的</h2>\n  <p>本アプリは、次の場合にのみ情報を収集・送信します。</p>\n  <div class=\"card\">\n    <table>\n      <tr><th>項目</th><th>収集する時点</th><th>目的</th></tr>\n      <tr><td>ニックネーム</td><td>利用者がランキングにスコアを登録するとき</td><td>ランキング表示</td></tr>\n      <tr><td>スコア・ゲームモード</td><td>ランキングスコア登録時</td><td>順位の算定</td></tr>\n      <tr><td>ランダムな端末識別子<br>（アプリが生成したUUID）</td><td>ランキングスコア登録時</td><td>端末ごとの最高スコアの維持（重複防止）</td></tr>\n      <tr><td>国コード<br>（例: KR — 端末の地域設定に基づく）</td><td>ランキングスコア登録時</td><td>ランキングへの国旗表示</td></tr>\n      <tr><td>お問い合わせ内容・ニックネーム</td><td>お問い合わせの作成・送信時</td><td>お問い合わせの受付および回答</td></tr>\n      <tr><td>ランダムな端末識別子・アプリ/OSバージョン・国コード・実行情報</td><td>アプリ起動時（利用統計）</td><td>重複のない利用者数の集計およびサービス改善</td></tr>\n    </table>\n  </div>\n  <p>上記の「ランダムな端末識別子」はアプリがランダムに生成した値であり、端末の実際の固有番号（IMEI、広告識別子など）や利用者を特定できる情報ではありません。アプリ起動時に収集される利用統計は、この識別子を基準とした匿名の集計（利用者数・再訪問など）にのみ使用され、個人を識別することはありません。</p>\n\n  <h2>2. 端末内にのみ保存される情報（サーバーへ送信しない）</h2>\n  <ul>\n    <li>ゲームの進行度、獲得した星、ヒントの残数</li>\n    <li>ニックネーム、サウンド・ハプティクスなどの設定値</li>\n  </ul>\n  <p>これらの情報は端末のローカルストレージ（iOS UserDefaults / Android SharedPreferences）にのみ保管され、アプリを削除すると一緒に削除されます。</p>\n\n  <h2>3. 収集しない情報</h2>\n  <ul>\n    <li>氏名、メールアドレス、電話番号、住所などの身元情報</li>\n    <li>連絡先、写真、位置情報（GPS）、マイクなどの端末権限情報</li>\n    <li>実際の端末固有識別子および広告識別子</li>\n  </ul>\n\n  <h2>4. 保有および利用期間</h2>\n  <p>ランキングに登録されたニックネーム・スコア・国コード、お問い合わせ内容、利用統計情報は、サービスの提供・運営のために保管されます。利用者が削除を要求した場合、当該記録を遅滞なく削除します。</p>\n\n  <h2>5. 第三者提供および処理の委託</h2>\n  <p>本アプリは、収集した情報を第三者に販売または提供することはありません。収集されたデータは、サービス運営のための自社サーバー（duo.jiny.shop）に保存されます。</p>\n\n  <h2>6. 広告</h2>\n  <p>現在のバージョンには広告は含まれていません。今後広告が導入される場合は、本方針を更新し、アプリ内で告知します。</p>\n\n  <h2>7. 児童の個人情報</h2>\n  <p>本アプリは、満14歳未満の児童を含む一般利用者を対象としており、児童から意図的に個人情報を収集することはありません。</p>\n\n  <h2>8. 利用者の権利</h2>\n  <p>利用者はいつでも自身のランキング記録・お問い合わせ履歴の削除を要求でき、アプリ設定の「進行度の初期化」によって端末内に保存されたデータを削除できます。</p>\n\n  <h2>9. お問い合わせ先</h2>\n  <div class=\"card\">\n    <p style=\"margin:0\">個人情報に関するお問い合わせ: <a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n  </div>\n\n  <h2>10. 方針の変更</h2>\n  <p>本方針が変更される場合は、施行日を更新して本ページに掲載します。</p>\n\n  <footer>ルールを探せ（CatchTheRule） · 本方針は2026年6月5日から適用されます。</footer>", "zh": "<span class=\"badge\">发现规律 · CatchTheRule</span>\n  <h1>隐私政策</h1>\n  <div class=\"eff\">施行日期：2026年6月5日</div>\n\n  <p>发现规律（CatchTheRule，以下简称“本应用”）珍视用户的个人信息，仅收集最少量的信息。本应用无需单独注册或登录，大部分数据仅保存在用户的设备上。</p>\n\n  <h2>1. 收集的信息及目的</h2>\n  <p>本应用仅在以下情形下收集并传输信息。</p>\n  <div class=\"card\">\n    <table>\n      <tr><th>项目</th><th>收集时点</th><th>目的</th></tr>\n      <tr><td>昵称</td><td>用户向排行榜提交分数时</td><td>排行榜显示</td></tr>\n      <tr><td>分数·游戏模式</td><td>提交排行榜分数时</td><td>排名计算</td></tr>\n      <tr><td>随机设备标识符<br>（由应用生成的 UUID）</td><td>提交排行榜分数时</td><td>保留每台设备的最高分（防止重复）</td></tr>\n      <tr><td>国家代码<br>（例如：KR — 基于设备的地区设置）</td><td>提交排行榜分数时</td><td>在排行榜上显示国旗</td></tr>\n      <tr><td>咨询内容·昵称</td><td>填写并发送咨询时</td><td>受理咨询并答复</td></tr>\n      <tr><td>随机设备标识符·应用/操作系统版本·国家代码·启动信息</td><td>应用启动时（使用统计）</td><td>统计去重后的用户数并改进服务</td></tr>\n    </table>\n  </div>\n  <p>上述“随机设备标识符”是应用随机生成的值，并非设备的真实唯一编号（IMEI、广告标识符等）或可识别特定用户的信息。应用启动时收集的使用统计仅用于以该标识符为基准的匿名汇总（用户数·回访等），不识别个人。</p>\n\n  <h2>2. 仅保存在设备上的信息（不向服务器传输）</h2>\n  <ul>\n    <li>游戏进度、获得的星星、剩余提示数量</li>\n    <li>昵称、声音·触感等设置值</li>\n  </ul>\n  <p>这些信息仅保存在设备的本地存储（iOS UserDefaults / Android SharedPreferences）中，删除应用时会一并删除。</p>\n\n  <h2>3. 不收集的信息</h2>\n  <ul>\n    <li>姓名、电子邮箱、电话号码、地址等身份信息</li>\n    <li>通讯录、照片、位置（GPS）、麦克风等设备权限信息</li>\n    <li>真实设备唯一标识符及广告标识符</li>\n  </ul>\n\n  <h2>4. 保留及使用期限</h2>\n  <p>登记在排行榜上的昵称·分数·国家代码、咨询内容、使用统计信息将为提供和运营服务而保存。用户请求删除时，将立即删除相关记录。</p>\n\n  <h2>5. 向第三方提供及处理委托</h2>\n  <p>本应用不会将收集的信息出售或提供给第三方。收集的数据保存在用于服务运营的自有服务器（duo.jiny.shop）上。</p>\n\n  <h2>6. 广告</h2>\n  <p>当前版本不包含广告。日后如引入广告，将更新本政策并在应用内告知。</p>\n\n  <h2>7. 儿童的个人信息</h2>\n  <p>本应用面向包括未满14周岁儿童在内的一般用户，不会有意收集儿童的个人信息。</p>\n\n  <h2>8. 用户的权利</h2>\n  <p>用户可随时请求删除自己的排行榜记录·咨询历史，并可通过应用设置中的“重置进度”删除设备内保存的数据。</p>\n\n  <h2>9. 联系方式</h2>\n  <div class=\"card\">\n    <p style=\"margin:0\">个人信息相关咨询：<a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n  </div>\n\n  <h2>10. 政策的变更</h2>\n  <p>本政策如有变更，将更新施行日期并发布于本页面。</p>\n\n  <footer>发现规律（CatchTheRule） · 本政策自2026年6月5日起适用。</footer>", "es": "<span class=\"badge\">Encuentra la Regla · CatchTheRule</span>\n  <h1>Política de Privacidad</h1>\n  <div class=\"eff\">Fecha de entrada en vigor: 5 de junio de 2026</div>\n\n  <p>Encuentra la Regla (CatchTheRule, en adelante \"la aplicación\") trata la información personal de los usuarios con sumo cuidado y recopila únicamente la información mínima necesaria. La aplicación no requiere registro ni inicio de sesión, y la mayoría de los datos se almacenan exclusivamente en el dispositivo del usuario.</p>\n\n  <h2>1. Información que se recopila y su finalidad</h2>\n  <p>La aplicación recopila y transmite información únicamente en los siguientes casos.</p>\n  <div class=\"card\">\n    <table>\n      <tr><th>Elemento</th><th>Momento de recopilación</th><th>Finalidad</th></tr>\n      <tr><td>Apodo</td><td>Cuando el usuario registra una puntuación en la clasificación</td><td>Mostrar la clasificación</td></tr>\n      <tr><td>Puntuación y modo de juego</td><td>Al registrar una puntuación en la clasificación</td><td>Cálculo del ranking</td></tr>\n      <tr><td>Identificador aleatorio del dispositivo<br>(UUID generado por la aplicación)</td><td>Al registrar una puntuación en la clasificación</td><td>Conservar la mejor puntuación por dispositivo (evitar duplicados)</td></tr>\n      <tr><td>Código de país<br>(p. ej.: KR — según la configuración regional del dispositivo)</td><td>Al registrar una puntuación en la clasificación</td><td>Mostrar la bandera en la clasificación</td></tr>\n      <tr><td>Contenido de la consulta y apodo</td><td>Al redactar y enviar una consulta</td><td>Recepción y respuesta de la consulta</td></tr>\n      <tr><td>Identificador aleatorio del dispositivo, versión de la aplicación/SO, código de país e información de ejecución</td><td>Al iniciar la aplicación (estadísticas de uso)</td><td>Recuento de usuarios únicos y mejora del servicio</td></tr>\n    </table>\n  </div>\n  <p>El mencionado \"identificador aleatorio del dispositivo\" es un valor generado de forma aleatoria por la aplicación y no constituye el número de identificación real del dispositivo (IMEI, identificador publicitario, etc.) ni información que permita identificar al usuario. Las estadísticas de uso recopiladas al iniciar la aplicación se utilizan únicamente para realizar recuentos anónimos basados en este identificador (número de usuarios, visitas recurrentes, etc.) y no identifican a ninguna persona.</p>\n\n  <h2>2. Información almacenada únicamente en el dispositivo (no se transmite al servidor)</h2>\n  <ul>\n    <li>Progreso del juego, estrellas obtenidas y pistas restantes</li>\n    <li>Apodo y ajustes como sonido y vibración háptica</li>\n  </ul>\n  <p>Esta información se conserva exclusivamente en el almacenamiento local del dispositivo (UserDefaults en iOS / SharedPreferences en Android) y se elimina junto con la aplicación al desinstalarla.</p>\n\n  <h2>3. Información que no se recopila</h2>\n  <ul>\n    <li>Información de identidad como nombre, correo electrónico, número de teléfono o dirección</li>\n    <li>Información de permisos del dispositivo como contactos, fotos, ubicación (GPS) o micrófono</li>\n    <li>Identificador único real del dispositivo e identificador publicitario</li>\n  </ul>\n\n  <h2>4. Período de conservación y uso</h2>\n  <p>El apodo, la puntuación y el código de país registrados en la clasificación, el contenido de las consultas y la información de estadísticas de uso se conservan para la prestación y el funcionamiento del servicio. Si el usuario solicita su eliminación, dichos registros se eliminarán sin demora.</p>\n\n  <h2>5. Cesión a terceros y encargo del tratamiento</h2>\n  <p>La aplicación no vende ni cede a terceros la información recopilada. Los datos recopilados se almacenan en un servidor propio destinado al funcionamiento del servicio (duo.jiny.shop).</p>\n\n  <h2>6. Publicidad</h2>\n  <p>La versión actual no incluye publicidad. En caso de incorporarse publicidad en el futuro, se actualizará esta política y se notificará dentro de la aplicación.</p>\n\n  <h2>7. Información personal de menores</h2>\n  <p>La aplicación está dirigida al público general, incluidos los menores de 14 años, y no recopila intencionadamente información personal de menores.</p>\n\n  <h2>8. Derechos del usuario</h2>\n  <p>El usuario puede solicitar en cualquier momento la eliminación de sus registros de clasificación y su historial de consultas, y puede eliminar los datos almacenados en el dispositivo mediante la opción \"Restablecer progreso\" de los ajustes de la aplicación.</p>\n\n  <h2>9. Contacto</h2>\n  <div class=\"card\">\n    <p style=\"margin:0\">Consultas sobre privacidad: <a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n  </div>\n\n  <h2>10. Modificaciones de la política</h2>\n  <p>En caso de que esta política se modifique, se actualizará la fecha de entrada en vigor y se publicará en esta página.</p>\n\n  <footer>Encuentra la Regla (CatchTheRule) · Esta política se aplica a partir del 5 de junio de 2026.</footer>", "fr": "<span class=\"badge\">Trouve le Motif · CatchTheRule</span>\n  <h1>Politique de confidentialité</h1>\n  <div class=\"eff\">Date d'entrée en vigueur : 5 juin 2026</div>\n\n  <p>Trouve le Motif (CatchTheRule, ci-après « l'application ») traite les données personnelles de ses utilisateurs avec le plus grand soin et ne collecte que le strict minimum d'informations. L'application ne requiert aucune inscription ni connexion distincte, et la plupart des données sont stockées uniquement sur l'appareil de l'utilisateur.</p>\n\n  <h2>1. Informations collectées et finalités</h2>\n  <p>L'application ne collecte et ne transmet des informations que dans les cas suivants.</p>\n  <div class=\"card\">\n    <table>\n      <tr><th>Élément</th><th>Moment de la collecte</th><th>Finalité</th></tr>\n      <tr><td>Pseudonyme</td><td>Lorsque l'utilisateur enregistre un score dans le classement</td><td>Affichage du classement</td></tr>\n      <tr><td>Score et mode de jeu</td><td>Lors de l'enregistrement d'un score dans le classement</td><td>Calcul du classement</td></tr>\n      <tr><td>Identifiant d'appareil aléatoire<br>(UUID généré par l'application)</td><td>Lors de l'enregistrement d'un score dans le classement</td><td>Conservation du meilleur score par appareil (prévention des doublons)</td></tr>\n      <tr><td>Code pays<br>(par ex. KR — basé sur les réglages régionaux de l'appareil)</td><td>Lors de l'enregistrement d'un score dans le classement</td><td>Affichage du drapeau dans le classement</td></tr>\n      <tr><td>Contenu de la demande et pseudonyme</td><td>Lors de la rédaction et de l'envoi d'une demande</td><td>Réception des demandes et réponses</td></tr>\n      <tr><td>Identifiant d'appareil aléatoire, version de l'application/de l'OS, code pays et informations de lancement</td><td>Au lancement de l'application (statistiques d'utilisation)</td><td>Comptage du nombre d'utilisateurs sans doublon et amélioration du service</td></tr>\n    </table>\n  </div>\n  <p>L'« identifiant d'appareil aléatoire » mentionné ci-dessus est une valeur générée de manière aléatoire par l'application ; il ne s'agit ni du numéro d'identification réel de l'appareil (IMEI, identifiant publicitaire, etc.) ni d'une information permettant d'identifier l'utilisateur. Les statistiques d'utilisation collectées au lancement de l'application servent uniquement à des agrégations anonymes basées sur cet identifiant (nombre d'utilisateurs, visites répétées, etc.) et ne permettent pas d'identifier une personne.</p>\n\n  <h2>2. Informations stockées uniquement sur l'appareil (non transmises au serveur)</h2>\n  <ul>\n    <li>Progression du jeu, étoiles obtenues, nombre d'indices restants</li>\n    <li>Pseudonyme, paramètres tels que le son et le retour haptique</li>\n  </ul>\n  <p>Ces informations sont conservées uniquement dans le stockage local de l'appareil (UserDefaults sous iOS / SharedPreferences sous Android) et sont supprimées en même temps que l'application lorsqu'elle est désinstallée.</p>\n\n  <h2>3. Informations non collectées</h2>\n  <ul>\n    <li>Informations d'identité telles que le nom, l'adresse e-mail, le numéro de téléphone ou l'adresse postale</li>\n    <li>Informations liées aux autorisations de l'appareil telles que les contacts, les photos, la localisation (GPS) ou le microphone</li>\n    <li>Identifiant unique réel de l'appareil et identifiant publicitaire</li>\n  </ul>\n\n  <h2>4. Durée de conservation et d'utilisation</h2>\n  <p>Le pseudonyme, le score et le code pays enregistrés dans le classement, le contenu des demandes ainsi que les statistiques d'utilisation sont conservés aux fins de la fourniture et de l'exploitation du service. Lorsqu'un utilisateur demande la suppression de ses données, l'enregistrement concerné est supprimé sans délai.</p>\n\n  <h2>5. Transmission à des tiers et sous-traitance du traitement</h2>\n  <p>L'application ne vend ni ne transmet à des tiers les informations collectées. Les données collectées sont stockées sur notre propre serveur dédié à l'exploitation du service (duo.jiny.shop).</p>\n\n  <h2>6. Publicité</h2>\n  <p>La version actuelle ne contient aucune publicité. Si de la publicité venait à être introduite à l'avenir, la présente politique sera mise à jour et un avis sera affiché dans l'application.</p>\n\n  <h2>7. Données personnelles des enfants</h2>\n  <p>L'application s'adresse au grand public, y compris aux enfants de moins de 14 ans, et ne collecte pas intentionnellement de données personnelles auprès des enfants.</p>\n\n  <h2>8. Droits de l'utilisateur</h2>\n  <p>L'utilisateur peut à tout moment demander la suppression de ses enregistrements de classement et de l'historique de ses demandes, et peut supprimer les données stockées sur son appareil au moyen de la fonction « Réinitialiser la progression » dans les paramètres de l'application.</p>\n\n  <h2>9. Contact</h2>\n  <div class=\"card\">\n    <p style=\"margin:0\">Demandes relatives aux données personnelles : <a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n  </div>\n\n  <h2>10. Modification de la politique</h2>\n  <p>En cas de modification de la présente politique, la date d'entrée en vigueur sera mise à jour et publiée sur cette page.</p>\n\n  <footer>Trouve le Motif (CatchTheRule) · La présente politique s'applique à compter du 5 juin 2026.</footer>", "de": "<span class=\"badge\">Finde die Regel · CatchTheRule</span>\n  <h1>Datenschutzerklärung</h1>\n  <div class=\"eff\">Inkrafttreten: 5. Juni 2026</div>\n\n  <p>Finde die Regel (CatchTheRule, nachfolgend „App“) geht sorgsam mit den personenbezogenen Daten der Nutzer um und erhebt nur ein Minimum an Informationen. Diese App erfordert keine gesonderte Registrierung oder Anmeldung, und die meisten Daten werden ausschließlich auf dem Gerät des Nutzers gespeichert.</p>\n\n  <h2>1. Erhobene Daten und Zwecke</h2>\n  <p>Die App erhebt und übermittelt Daten nur in den folgenden Fällen.</p>\n  <div class=\"card\">\n    <table>\n      <tr><th>Angabe</th><th>Zeitpunkt der Erhebung</th><th>Zweck</th></tr>\n      <tr><td>Spitzname</td><td>Wenn der Nutzer eine Punktzahl in der Rangliste einträgt</td><td>Anzeige in der Rangliste</td></tr>\n      <tr><td>Punktzahl und Spielmodus</td><td>Beim Eintragen einer Ranglistenpunktzahl</td><td>Ermittlung der Platzierung</td></tr>\n      <tr><td>Zufällige Gerätekennung<br>(von der App erzeugte UUID)</td><td>Beim Eintragen einer Ranglistenpunktzahl</td><td>Beibehaltung der Höchstpunktzahl je Gerät (Vermeidung von Doppeleinträgen)</td></tr>\n      <tr><td>Ländercode<br>(z. B. KR – basierend auf den Regionseinstellungen des Geräts)</td><td>Beim Eintragen einer Ranglistenpunktzahl</td><td>Anzeige der Flagge in der Rangliste</td></tr>\n      <tr><td>Inhalt der Anfrage und Spitzname</td><td>Beim Verfassen und Senden einer Anfrage</td><td>Entgegennahme der Anfrage und Beantwortung</td></tr>\n      <tr><td>Zufällige Gerätekennung, App-/OS-Version, Ländercode und Ausführungsinformationen</td><td>Beim Start der App (Nutzungsstatistik)</td><td>Ermittlung der Anzahl eindeutiger Nutzer und Verbesserung des Dienstes</td></tr>\n    </table>\n  </div>\n  <p>Die oben genannte „zufällige Gerätekennung“ ist ein von der App nach dem Zufallsprinzip erzeugter Wert und stellt weder die tatsächliche eindeutige Gerätenummer (IMEI, Werbekennung usw.) noch eine Information dar, mit der sich der Nutzer identifizieren ließe. Die beim Start der App erhobene Nutzungsstatistik wird ausschließlich für anonyme Auswertungen auf Grundlage dieser Kennung (Nutzerzahl, wiederkehrende Besuche usw.) verwendet und dient nicht der Identifizierung von Einzelpersonen.</p>\n\n  <h2>2. Nur auf dem Gerät gespeicherte Daten (keine Übermittlung an den Server)</h2>\n  <ul>\n    <li>Spielfortschritt, gesammelte Sterne, verbleibende Hinweise</li>\n    <li>Spitzname sowie Einstellungen wie Ton und Haptik</li>\n  </ul>\n  <p>Diese Daten werden ausschließlich im lokalen Speicher des Geräts (iOS UserDefaults / Android SharedPreferences) abgelegt und mit dem Löschen der App ebenfalls entfernt.</p>\n\n  <h2>3. Nicht erhobene Daten</h2>\n  <ul>\n    <li>Identitätsdaten wie Name, E-Mail-Adresse, Telefonnummer oder Anschrift</li>\n    <li>Geräteberechtigungen wie Kontakte, Fotos, Standort (GPS) oder Mikrofon</li>\n    <li>Tatsächliche eindeutige Gerätekennungen und Werbekennungen</li>\n  </ul>\n\n  <h2>4. Aufbewahrungs- und Nutzungsdauer</h2>\n  <p>Die in der Rangliste eingetragenen Spitznamen, Punktzahlen und Ländercodes, die Inhalte von Anfragen sowie die Nutzungsstatistik werden zur Bereitstellung und zum Betrieb des Dienstes aufbewahrt. Verlangt ein Nutzer die Löschung, werden die betreffenden Daten unverzüglich gelöscht.</p>\n\n  <h2>5. Weitergabe an Dritte und Auftragsverarbeitung</h2>\n  <p>Die App verkauft die erhobenen Daten nicht an Dritte und gibt sie nicht an Dritte weiter. Die erhobenen Daten werden auf einem eigenen Server (duo.jiny.shop) zum Betrieb des Dienstes gespeichert.</p>\n\n  <h2>6. Werbung</h2>\n  <p>Die aktuelle Version enthält keine Werbung. Sollte künftig Werbung eingeführt werden, wird diese Erklärung aktualisiert und in der App darauf hingewiesen.</p>\n\n  <h2>7. Personenbezogene Daten von Kindern</h2>\n  <p>Die App richtet sich an allgemeine Nutzer einschließlich Kindern unter 14 Jahren und erhebt nicht absichtlich personenbezogene Daten von Kindern.</p>\n\n  <h2>8. Rechte der Nutzer</h2>\n  <p>Nutzer können jederzeit die Löschung ihrer Ranglisteneinträge und ihres Anfrageverlaufs verlangen und über die Funktion „Fortschritt zurücksetzen“ in den App-Einstellungen die auf dem Gerät gespeicherten Daten löschen.</p>\n\n  <h2>9. Kontakt</h2>\n  <div class=\"card\">\n    <p style=\"margin:0\">Anfragen zum Datenschutz: <a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n  </div>\n\n  <h2>10. Änderungen dieser Erklärung</h2>\n  <p>Bei Änderungen dieser Erklärung wird das Datum des Inkrafttretens aktualisiert und auf dieser Seite veröffentlicht.</p>\n\n  <footer>Finde die Regel (CatchTheRule) · Diese Erklärung gilt ab dem 5. Juni 2026.</footer>"};
const NAMES = {"en": "English", "ko": "한국어", "ja": "日本語", "zh": "简体中文", "es": "Español", "fr": "Français", "de": "Deutsch"};
function pickLang(){const q=new URLSearchParams(location.search).get("lang");const cand=(q||navigator.language||"en").toLowerCase();const code=cand.startsWith("zh")?"zh":cand.slice(0,2);return I18N[code]?code:"en";}
let cur=pickLang();const sel=document.getElementById("lang");Object.keys(NAMES).forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=NAMES[c];sel.appendChild(o);});
function render(){document.getElementById("content").innerHTML=I18N[cur];document.documentElement.lang=(cur==="zh")?"zh-Hans":cur;sel.value=cur;}
sel.addEventListener("change",e=>{cur=e.target.value;render();const u=new URL(location);u.searchParams.set("lang",cur);history.replaceState(null,"",u);});
render();
</script>
