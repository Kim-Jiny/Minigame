<style>
  :root {

  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  .badge {
    display: inline-block; font-size: 13px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    padding: 6px 14px; border-radius: 999px; margin-bottom: 16px;

  h1 { font-size: 26px; margin: 0 0 6px; font-weight: 800; }

  p, li { color: var(--sub); font-size: 15px; }
  ul { padding-left: 20px; }
  a { color: var(--accent2); }
  .card {
    background: var(--card); border: 1px solid var(--stroke);
    border-radius: 16px; padding: 16px 20px; margin: 16px 0;

  table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--stroke); color: var(--sub); vertical-align: top; }

  .langbar { display:flex; justify-content:flex-end; margin-bottom: 18px; }
  .langbar select {
    background: var(--card); color: var(--text); border: 1px solid var(--stroke);

<script>
const I18N = {"ko": "<span class=\"badge\">규칙찾기 · CatchTheRule</span>\n  <h1>개인정보처리방침</h1>\n  <div class=\"eff\">시행일: 2026년 6월 4일</div>\n\n  <p>규칙찾기(CatchTheRule, 이하 \"앱\")는 이용자의 개인정보를 소중히 다루며, 최소한의 정보만 수집합니다. 본 앱은 별도의 회원가입이나 로그인이 없으며, 대부분의 데이터는 이용자의 기기에만 저장됩니다.</p>\n\n  <h2>1. 수집하는 정보와 목적</h2>\n  <p>앱은 다음 경우에만 정보를 수집·전송합니다.</p>\n  <div class=\"card\">\n    <table>\n      <tr><th>항목</th><th>수집 시점</th><th>목적</th></tr>\n      <tr><td>닉네임</td><td>이용자가 랭킹에 점수를 등록할 때</td><td>랭킹 표시</td></tr>\n      <tr><td>점수·게임 모드</td><td>랭킹 점수 등록 시</td><td>순위 산정</td></tr>\n      <tr><td>임의 기기 식별자<br>(앱이 생성한 UUID)</td><td>랭킹 점수 등록 시</td><td>기기당 최고 점수 유지(중복 방지)</td></tr>\n      <tr><td>국가 코드<br>(예: KR — 기기 지역설정 기반)</td><td>랭킹 점수 등록 시</td><td>랭킹에 국기 표시</td></tr>\n    </table>\n  </div>\n  <p>위 \"임의 기기 식별자\"는 앱이 무작위로 생성한 값으로, 기기의 실제 고유번호(IMEI, 광고 식별자 등)나 이용자를 특정할 수 있는 정보가 아닙니다.</p>\n\n  <h2>2. 기기에만 저장되는 정보(서버로 전송하지 않음)</h2>\n  <ul>\n    <li>게임 진행도, 획득한 별, 힌트 잔여 수</li>\n    <li>닉네임, 사운드·햅틱 등 설정값</li>\n  </ul>\n  <p>이 정보들은 기기의 로컬 저장소(iOS UserDefaults / Android SharedPreferences)에만 보관되며, 앱을 삭제하면 함께 삭제됩니다.</p>\n\n  <h2>3. 수집하지 않는 정보</h2>\n  <ul>\n    <li>이름, 이메일, 전화번호, 주소 등 신원 정보</li>\n    <li>연락처, 사진, 위치(GPS), 마이크 등 기기 권한 정보</li>\n    <li>실제 기기 고유 식별자 및 광고 식별자</li>\n  </ul>\n\n  <h2>4. 보유 및 이용 기간</h2>\n  <p>랭킹에 등록된 닉네임·점수·국가 코드는 랭킹 서비스 제공을 위해 보관됩니다. 이용자가 삭제를 요청하면 해당 기록을 지체 없이 삭제합니다.</p>\n\n  <h2>5. 제3자 제공 및 처리 위탁</h2>\n  <p>앱은 수집한 정보를 제3자에게 판매하거나 제공하지 않습니다. 랭킹 데이터는 서비스 운영을 위한 자체 서버(duo.jiny.shop)에 저장됩니다.</p>\n\n  <h2>6. 광고</h2>\n  <p>현재 버전은 광고를 포함하지 않습니다. 향후 광고가 도입될 경우 본 방침을 갱신하고 앱 내에 고지합니다.</p>\n\n  <h2>7. 아동의 개인정보</h2>\n  <p>앱은 만 14세 미만 아동을 포함한 일반 이용자를 대상으로 하며, 아동으로부터 의도적으로 개인정보를 수집하지 않습니다.</p>\n\n  <h2>8. 이용자의 권리</h2>\n  <p>이용자는 언제든지 자신의 랭킹 기록 삭제를 요청할 수 있으며, 앱 설정의 \"진행도 초기화\"로 기기 내 저장 데이터를 삭제할 수 있습니다.</p>\n\n  <h2>9. 문의처</h2>\n  <div class=\"card\">\n    <p style=\"margin:0\">개인정보 관련 문의: <a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n  </div>\n\n  <h2>10. 방침의 변경</h2>\n  <p>본 방침이 변경될 경우 시행일을 갱신하여 본 페이지에 게시합니다.</p>\n\n  <footer>규칙찾기(CatchTheRule) · 본 방침은 2026년 6월 4일부터 적용됩니다.</footer>", "en": "<span class=\"badge\">Catch the Rule · CatchTheRule</span>\n  <h1>Privacy Policy</h1>\n  <div class=\"eff\">Effective Date: June 4, 2026</div>\n\n  <p>Catch the Rule (CatchTheRule, hereinafter the \"App\") values the privacy of its users and collects only the minimum necessary information. The App requires no separate sign-up or login, and most data is stored solely on the user's device.</p>\n\n  <h2>1. Information Collected and Purpose</h2>\n  <p>The App collects and transmits information only in the following cases.</p>\n  <div class=\"card\">\n    <table>\n      <tr><th>Item</th><th>When Collected</th><th>Purpose</th></tr>\n      <tr><td>Nickname</td><td>When the user submits a score to the ranking</td><td>Display on the ranking</td></tr>\n      <tr><td>Score and game mode</td><td>When submitting a ranking score</td><td>Ranking calculation</td></tr>\n      <tr><td>Random device identifier<br>(a UUID generated by the App)</td><td>When submitting a ranking score</td><td>Maintaining the highest score per device (duplicate prevention)</td></tr>\n      <tr><td>Country code<br>(e.g., KR — based on the device region settings)</td><td>When submitting a ranking score</td><td>Displaying the flag on the ranking</td></tr>\n    </table>\n  </div>\n  <p>The above \"random device identifier\" is a value randomly generated by the App. It is not the device's actual unique number (such as IMEI or an advertising identifier) and is not information that can identify the user.</p>\n\n  <h2>2. Information Stored Only on the Device (Not Transmitted to the Server)</h2>\n  <ul>\n    <li>Game progress, stars earned, and remaining hints</li>\n    <li>Nickname and settings such as sound and haptics</li>\n  </ul>\n  <p>This information is kept only in the device's local storage (iOS UserDefaults / Android SharedPreferences) and is deleted together with the App when it is uninstalled.</p>\n\n  <h2>3. Information Not Collected</h2>\n  <ul>\n    <li>Identity information such as name, email, phone number, and address</li>\n    <li>Device permission information such as contacts, photos, location (GPS), and microphone</li>\n    <li>The device's actual unique identifier and advertising identifier</li>\n  </ul>\n\n  <h2>4. Retention and Usage Period</h2>\n  <p>The nickname, score, and country code registered on the ranking are retained for the purpose of providing the ranking service. If a user requests deletion, the corresponding record is deleted without delay.</p>\n\n  <h2>5. Provision to Third Parties and Processing Consignment</h2>\n  <p>The App does not sell or provide the collected information to third parties. Ranking data is stored on our own server (duo.jiny.shop) for the operation of the service.</p>\n\n  <h2>6. Advertising</h2>\n  <p>The current version contains no advertising. If advertising is introduced in the future, this policy will be updated and notice will be provided within the App.</p>\n\n  <h2>7. Children's Personal Information</h2>\n  <p>The App is intended for general users, including children under the age of 14, and does not intentionally collect personal information from children.</p>\n\n  <h2>8. Users' Rights</h2>\n  <p>Users may request deletion of their ranking records at any time, and may delete the data stored on their device using \"Reset Progress\" in the App settings.</p>\n\n  <h2>9. Contact</h2>\n  <div class=\"card\">\n    <p style=\"margin:0\">Privacy-related inquiries: <a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n  </div>\n\n  <h2>10. Changes to This Policy</h2>\n  <p>If this policy is changed, the effective date will be updated and posted on this page.</p>\n\n  <footer>Catch the Rule (CatchTheRule) · This policy is effective as of June 4, 2026.</footer>", "ja": "<span class=\"badge\">ルールを探せ · CatchTheRule</span>\n  <h1>プライバシーポリシー</h1>\n  <div class=\"eff\">施行日: 2026年6月4日</div>\n\n  <p>ルールを探せ（CatchTheRule、以下「本アプリ」）は、利用者の個人情報を大切に取り扱い、必要最小限の情報のみを収集します。本アプリには別途の会員登録やログインはなく、ほとんどのデータは利用者の端末内にのみ保存されます。</p>\n\n  <h2>1. 収集する情報と目的</h2>\n  <p>本アプリは、以下の場合にのみ情報を収集・送信します。</p>\n  <div class=\"card\">\n    <table>\n      <tr><th>項目</th><th>収集時点</th><th>目的</th></tr>\n      <tr><td>ニックネーム</td><td>利用者がランキングにスコアを登録するとき</td><td>ランキング表示</td></tr>\n      <tr><td>スコア・ゲームモード</td><td>ランキングスコア登録時</td><td>順位の算定</td></tr>\n      <tr><td>任意の端末識別子<br>（アプリが生成したUUID）</td><td>ランキングスコア登録時</td><td>端末ごとの最高スコアの保持（重複防止）</td></tr>\n      <tr><td>国コード<br>（例: KR — 端末の地域設定に基づく）</td><td>ランキングスコア登録時</td><td>ランキングへの国旗表示</td></tr>\n    </table>\n  </div>\n  <p>上記の「任意の端末識別子」はアプリがランダムに生成した値であり、端末の実際の固有番号（IMEI、広告識別子など）や利用者を特定できる情報ではありません。</p>\n\n  <h2>2. 端末にのみ保存される情報（サーバーへ送信しない）</h2>\n  <ul>\n    <li>ゲームの進行度、獲得した星、ヒントの残り数</li>\n    <li>ニックネーム、サウンド・ハプティクスなどの設定値</li>\n  </ul>\n  <p>これらの情報は端末のローカルストレージ（iOS UserDefaults / Android SharedPreferences）にのみ保管され、アプリを削除すると一緒に削除されます。</p>\n\n  <h2>3. 収集しない情報</h2>\n  <ul>\n    <li>氏名、メールアドレス、電話番号、住所などの身元情報</li>\n    <li>連絡先、写真、位置（GPS）、マイクなどの端末権限情報</li>\n    <li>実際の端末固有識別子および広告識別子</li>\n  </ul>\n\n  <h2>4. 保有および利用期間</h2>\n  <p>ランキングに登録されたニックネーム・スコア・国コードは、ランキングサービス提供のために保管されます。利用者が削除を要請した場合、当該記録を遅滞なく削除します。</p>\n\n  <h2>5. 第三者提供および処理委託</h2>\n  <p>本アプリは収集した情報を第三者に販売または提供しません。ランキングデータはサービス運営のための自社サーバー（duo.jiny.shop）に保存されます。</p>\n\n  <h2>6. 広告</h2>\n  <p>現在のバージョンには広告を含みません。今後広告が導入される場合は、本ポリシーを更新し、アプリ内で告知します。</p>\n\n  <h2>7. 児童の個人情報</h2>\n  <p>本アプリは満14歳未満の児童を含む一般利用者を対象としており、児童から意図的に個人情報を収集することはありません。</p>\n\n  <h2>8. 利用者の権利</h2>\n  <p>利用者はいつでも自身のランキング記録の削除を要請でき、アプリ設定の「進行度の初期化」により端末内の保存データを削除できます。</p>\n\n  <h2>9. お問い合わせ</h2>\n  <div class=\"card\">\n    <p style=\"margin:0\">個人情報に関するお問い合わせ: <a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n  </div>\n\n  <h2>10. ポリシーの変更</h2>\n  <p>本ポリシーが変更される場合は、施行日を更新して本ページに掲載します。</p>\n\n  <footer>ルールを探せ（CatchTheRule） · 本ポリシーは2026年6月4日から適用されます。</footer>", "zh": "<span class=\"badge\">找规律 · CatchTheRule</span>\n  <h1>隐私政策</h1>\n  <div class=\"eff\">生效日期：2026年6月4日</div>\n\n  <p>找规律（CatchTheRule，以下简称\"本应用\"）珍视用户的个人信息，仅收集最少限度的信息。本应用无需单独注册或登录，大部分数据仅存储于用户的设备上。</p>\n\n  <h2>1. 收集的信息及目的</h2>\n  <p>本应用仅在以下情况下收集并传输信息。</p>\n  <div class=\"card\">\n    <table>\n      <tr><th>项目</th><th>收集时点</th><th>目的</th></tr>\n      <tr><td>昵称</td><td>用户在排行榜登记分数时</td><td>排行榜显示</td></tr>\n      <tr><td>分数·游戏模式</td><td>登记排行榜分数时</td><td>排名计算</td></tr>\n      <tr><td>随机设备标识符<br>（由应用生成的 UUID）</td><td>登记排行榜分数时</td><td>保留每台设备的最高分（防止重复）</td></tr>\n      <tr><td>国家代码<br>（例如：KR — 基于设备地区设置）</td><td>登记排行榜分数时</td><td>在排行榜显示国旗</td></tr>\n    </table>\n  </div>\n  <p>上述\"随机设备标识符\"是由应用随机生成的值，并非设备的实际唯一编号（IMEI、广告标识符等），也不是可用于特定用户的信息。</p>\n\n  <h2>2. 仅存储于设备上的信息（不会传输至服务器）</h2>\n  <ul>\n    <li>游戏进度、获得的星星、剩余提示次数</li>\n    <li>昵称、音效·震动等设置值</li>\n  </ul>\n  <p>这些信息仅保存在设备的本地存储（iOS UserDefaults / Android SharedPreferences）中，删除应用时将一并删除。</p>\n\n  <h2>3. 不收集的信息</h2>\n  <ul>\n    <li>姓名、电子邮箱、电话号码、住址等身份信息</li>\n    <li>通讯录、照片、位置（GPS）、麦克风等设备权限信息</li>\n    <li>设备的实际唯一标识符及广告标识符</li>\n  </ul>\n\n  <h2>4. 保留及使用期限</h2>\n  <p>登记在排行榜上的昵称·分数·国家代码将为提供排行榜服务而保留。用户请求删除时，将立即删除相关记录。</p>\n\n  <h2>5. 向第三方提供及处理委托</h2>\n  <p>本应用不会向第三方出售或提供所收集的信息。排行榜数据存储于用于服务运营的自有服务器（duo.jiny.shop）。</p>\n\n  <h2>6. 广告</h2>\n  <p>当前版本不含广告。今后如引入广告，将更新本政策并在应用内告知。</p>\n\n  <h2>7. 儿童的个人信息</h2>\n  <p>本应用面向包括未满14周岁儿童在内的一般用户，不会有意从儿童处收集个人信息。</p>\n\n  <h2>8. 用户的权利</h2>\n  <p>用户可随时请求删除自己的排行榜记录，并可通过应用设置中的\"重置进度\"删除设备内存储的数据。</p>\n\n  <h2>9. 联系方式</h2>\n  <div class=\"card\">\n    <p style=\"margin:0\">个人信息相关咨询：<a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n  </div>\n\n  <h2>10. 政策的变更</h2>\n  <p>本政策如有变更，将更新生效日期并发布于本页面。</p>\n\n  <footer>找规律（CatchTheRule） · 本政策自2026年6月4日起适用。</footer>", "es": "<span class=\"badge\">Encuentra la Regla · CatchTheRule</span>\n  <h1>Política de privacidad</h1>\n  <div class=\"eff\">Fecha de entrada en vigor: 4 de junio de 2026</div>\n\n  <p>Encuentra la Regla (CatchTheRule, en adelante, la \"app\") trata la información personal de los usuarios con sumo cuidado y solo recopila la información mínima necesaria. Esta app no requiere registro ni inicio de sesión, y la mayor parte de los datos se almacena únicamente en el dispositivo del usuario.</p>\n\n  <h2>1. Información recopilada y finalidad</h2>\n  <p>La app recopila y transmite información únicamente en los siguientes casos.</p>\n  <div class=\"card\">\n    <table>\n      <tr><th>Elemento</th><th>Momento de recopilación</th><th>Finalidad</th></tr>\n      <tr><td>Apodo</td><td>Cuando el usuario registra su puntuación en la clasificación</td><td>Mostrar la clasificación</td></tr>\n      <tr><td>Puntuación y modo de juego</td><td>Al registrar la puntuación en la clasificación</td><td>Cálculo del ranking</td></tr>\n      <tr><td>Identificador aleatorio del dispositivo<br>(UUID generado por la app)</td><td>Al registrar la puntuación en la clasificación</td><td>Conservar la mejor puntuación por dispositivo (evitar duplicados)</td></tr>\n      <tr><td>Código de país<br>(p. ej., KR — según la configuración regional del dispositivo)</td><td>Al registrar la puntuación en la clasificación</td><td>Mostrar la bandera en la clasificación</td></tr>\n    </table>\n  </div>\n  <p>El mencionado \"identificador aleatorio del dispositivo\" es un valor generado aleatoriamente por la app y no constituye un número de serie real del dispositivo (IMEI, identificador de publicidad, etc.) ni información que permita identificar al usuario.</p>\n\n  <h2>2. Información almacenada únicamente en el dispositivo (no se transmite al servidor)</h2>\n  <ul>\n    <li>Progreso del juego, estrellas obtenidas y pistas restantes</li>\n    <li>Apodo y ajustes como sonido y respuesta háptica</li>\n  </ul>\n  <p>Esta información se conserva únicamente en el almacenamiento local del dispositivo (iOS UserDefaults / Android SharedPreferences) y se elimina junto con la app cuando esta se desinstala.</p>\n\n  <h2>3. Información que no se recopila</h2>\n  <ul>\n    <li>Datos de identidad como nombre, correo electrónico, número de teléfono o dirección</li>\n    <li>Información sujeta a permisos del dispositivo, como contactos, fotos, ubicación (GPS) o micrófono</li>\n    <li>Identificadores únicos reales del dispositivo e identificadores de publicidad</li>\n  </ul>\n\n  <h2>4. Periodo de conservación y uso</h2>\n  <p>El apodo, la puntuación y el código de país registrados en la clasificación se conservan para prestar el servicio de clasificación. Si el usuario solicita su eliminación, dichos registros se eliminarán sin demora.</p>\n\n  <h2>5. Cesión a terceros y encargo del tratamiento</h2>\n  <p>La app no vende ni cede a terceros la información recopilada. Los datos de la clasificación se almacenan en un servidor propio destinado a la operación del servicio (duo.jiny.shop).</p>\n\n  <h2>6. Publicidad</h2>\n  <p>La versión actual no incluye publicidad. En caso de que se introduzca publicidad en el futuro, esta política se actualizará y se notificará dentro de la app.</p>\n\n  <h2>7. Información personal de menores</h2>\n  <p>La app está dirigida al público general, incluidos los menores de 14 años, y no recopila intencionadamente información personal de menores.</p>\n\n  <h2>8. Derechos del usuario</h2>\n  <p>El usuario puede solicitar en cualquier momento la eliminación de sus registros de clasificación, y puede eliminar los datos almacenados en el dispositivo mediante la opción \"Restablecer progreso\" en los ajustes de la app.</p>\n\n  <h2>9. Contacto</h2>\n  <div class=\"card\">\n    <p style=\"margin:0\">Consultas sobre privacidad: <a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n  </div>\n\n  <h2>10. Modificaciones de la política</h2>\n  <p>En caso de que esta política se modifique, se actualizará la fecha de entrada en vigor y se publicará en esta página.</p>\n\n  <footer>Encuentra la Regla (CatchTheRule) · Esta política se aplica a partir del 4 de junio de 2026.</footer>", "fr": "<span class=\"badge\">Trouve la Règle · CatchTheRule</span>\n  <h1>Politique de confidentialité</h1>\n  <div class=\"eff\">Date d'entrée en vigueur : 4 juin 2026</div>\n\n  <p>Trouve la Règle (CatchTheRule, ci-après « l'application ») traite les données personnelles des utilisateurs avec soin et ne collecte qu'un minimum d'informations. L'application ne nécessite ni inscription ni connexion, et la plupart des données sont stockées uniquement sur l'appareil de l'utilisateur.</p>\n\n  <h2>1. Informations collectées et finalité</h2>\n  <p>L'application ne collecte et ne transmet des informations que dans les cas suivants.</p>\n  <div class=\"card\">\n    <table>\n      <tr><th>Élément</th><th>Moment de la collecte</th><th>Finalité</th></tr>\n      <tr><td>Pseudonyme</td><td>Lorsque l'utilisateur enregistre un score au classement</td><td>Affichage du classement</td></tr>\n      <tr><td>Score · mode de jeu</td><td>Lors de l'enregistrement d'un score au classement</td><td>Calcul du classement</td></tr>\n      <tr><td>Identifiant d'appareil aléatoire<br>(UUID généré par l'application)</td><td>Lors de l'enregistrement d'un score au classement</td><td>Conservation du meilleur score par appareil (prévention des doublons)</td></tr>\n      <tr><td>Code pays<br>(ex. : KR — basé sur les paramètres régionaux de l'appareil)</td><td>Lors de l'enregistrement d'un score au classement</td><td>Affichage du drapeau dans le classement</td></tr>\n    </table>\n  </div>\n  <p>L'« identifiant d'appareil aléatoire » mentionné ci-dessus est une valeur générée aléatoirement par l'application ; il ne s'agit ni du numéro d'identification réel de l'appareil (IMEI, identifiant publicitaire, etc.) ni d'une information permettant d'identifier l'utilisateur.</p>\n\n  <h2>2. Informations stockées uniquement sur l'appareil (non transmises au serveur)</h2>\n  <ul>\n    <li>Progression du jeu, étoiles obtenues, nombre d'indices restants</li>\n    <li>Pseudonyme, paramètres tels que le son et le retour haptique</li>\n  </ul>\n  <p>Ces informations sont conservées uniquement dans le stockage local de l'appareil (iOS UserDefaults / Android SharedPreferences) et sont supprimées en même temps que la désinstallation de l'application.</p>\n\n  <h2>3. Informations non collectées</h2>\n  <ul>\n    <li>Informations d'identité telles que le nom, l'adresse e-mail, le numéro de téléphone ou l'adresse</li>\n    <li>Informations liées aux autorisations de l'appareil telles que les contacts, les photos, la localisation (GPS) ou le microphone</li>\n    <li>Identifiant unique réel de l'appareil et identifiant publicitaire</li>\n  </ul>\n\n  <h2>4. Durée de conservation et d'utilisation</h2>\n  <p>Le pseudonyme, le score et le code pays enregistrés au classement sont conservés afin de fournir le service de classement. Lorsqu'un utilisateur en demande la suppression, l'enregistrement concerné est supprimé sans délai.</p>\n\n  <h2>5. Communication à des tiers et sous-traitance</h2>\n  <p>L'application ne vend ni ne communique les informations collectées à des tiers. Les données de classement sont stockées sur notre propre serveur dédié à l'exploitation du service (duo.jiny.shop).</p>\n\n  <h2>6. Publicité</h2>\n  <p>La version actuelle ne contient aucune publicité. Si de la publicité venait à être introduite à l'avenir, la présente politique serait mise à jour et un avis serait affiché au sein de l'application.</p>\n\n  <h2>7. Données personnelles des enfants</h2>\n  <p>L'application s'adresse au grand public, y compris les enfants de moins de 14 ans, et ne collecte pas intentionnellement de données personnelles auprès des enfants.</p>\n\n  <h2>8. Droits de l'utilisateur</h2>\n  <p>L'utilisateur peut à tout moment demander la suppression de ses enregistrements au classement, et peut supprimer les données stockées sur l'appareil au moyen de l'option « Réinitialiser la progression » dans les paramètres de l'application.</p>\n\n  <h2>9. Contact</h2>\n  <div class=\"card\">\n    <p style=\"margin:0\">Pour toute question relative aux données personnelles : <a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n  </div>\n\n  <h2>10. Modification de la politique</h2>\n  <p>En cas de modification de la présente politique, la date d'entrée en vigueur sera mise à jour et publiée sur cette page.</p>\n\n  <footer>Trouve la Règle (CatchTheRule) · La présente politique s'applique à compter du 4 juin 2026.</footer>", "de": "<span class=\"badge\">Finde die Regel · CatchTheRule</span>\n  <h1>Datenschutzerklärung</h1>\n  <div class=\"eff\">Inkrafttreten: 4. Juni 2026</div>\n\n  <p>Finde die Regel (CatchTheRule, nachfolgend \"App\") behandelt die personenbezogenen Daten der Nutzer mit größter Sorgfalt und erhebt nur ein Minimum an Informationen. Die App erfordert keine gesonderte Registrierung oder Anmeldung, und die meisten Daten werden ausschließlich auf dem Gerät des Nutzers gespeichert.</p>\n\n  <h2>1. Erhobene Daten und Zweck</h2>\n  <p>Die App erhebt und übermittelt Daten ausschließlich in den folgenden Fällen.</p>\n  <div class=\"card\">\n    <table>\n      <tr><th>Angabe</th><th>Zeitpunkt der Erhebung</th><th>Zweck</th></tr>\n      <tr><td>Spitzname</td><td>Wenn der Nutzer eine Punktzahl in der Rangliste einträgt</td><td>Anzeige in der Rangliste</td></tr>\n      <tr><td>Punktzahl · Spielmodus</td><td>Beim Eintragen einer Ranglisten-Punktzahl</td><td>Ermittlung der Platzierung</td></tr>\n      <tr><td>Zufällige Gerätekennung<br>(von der App erzeugte UUID)</td><td>Beim Eintragen einer Ranglisten-Punktzahl</td><td>Beibehaltung der Bestpunktzahl pro Gerät (Vermeidung von Duplikaten)</td></tr>\n      <tr><td>Ländercode<br>(z. B. KR — basierend auf den Regionseinstellungen des Geräts)</td><td>Beim Eintragen einer Ranglisten-Punktzahl</td><td>Anzeige der Flagge in der Rangliste</td></tr>\n    </table>\n  </div>\n  <p>Die oben genannte \"zufällige Gerätekennung\" ist ein von der App zufällig erzeugter Wert und stellt weder die tatsächliche eindeutige Gerätenummer (IMEI, Werbe-ID usw.) noch eine Information dar, mit der sich der Nutzer identifizieren ließe.</p>\n\n  <h2>2. Ausschließlich auf dem Gerät gespeicherte Daten (keine Übermittlung an den Server)</h2>\n  <ul>\n    <li>Spielfortschritt, erworbene Sterne, verbleibende Anzahl an Hinweisen</li>\n    <li>Spitzname, Einstellungen wie Ton und Haptik</li>\n  </ul>\n  <p>Diese Daten werden ausschließlich im lokalen Speicher des Geräts (iOS UserDefaults / Android SharedPreferences) aufbewahrt und beim Deinstallieren der App mitgelöscht.</p>\n\n  <h2>3. Nicht erhobene Daten</h2>\n  <ul>\n    <li>Identitätsdaten wie Name, E-Mail-Adresse, Telefonnummer, Anschrift</li>\n    <li>Geräteberechtigungen wie Kontakte, Fotos, Standort (GPS), Mikrofon</li>\n    <li>Tatsächliche eindeutige Gerätekennungen sowie Werbe-IDs</li>\n  </ul>\n\n  <h2>4. Aufbewahrungs- und Nutzungsdauer</h2>\n  <p>Der in der Rangliste eingetragene Spitzname, die Punktzahl und der Ländercode werden zur Bereitstellung des Ranglistendienstes aufbewahrt. Auf Löschungsverlangen des Nutzers werden die entsprechenden Einträge unverzüglich gelöscht.</p>\n\n  <h2>5. Weitergabe an Dritte und Auftragsverarbeitung</h2>\n  <p>Die App verkauft die erhobenen Daten nicht an Dritte und gibt sie auch nicht an Dritte weiter. Die Ranglistendaten werden auf einem eigenen, für den Betrieb des Dienstes genutzten Server (duo.jiny.shop) gespeichert.</p>\n\n  <h2>6. Werbung</h2>\n  <p>Die aktuelle Version enthält keine Werbung. Sollte künftig Werbung eingeführt werden, wird diese Erklärung aktualisiert und in der App darauf hingewiesen.</p>\n\n  <h2>7. Personenbezogene Daten von Kindern</h2>\n  <p>Die App richtet sich an allgemeine Nutzer einschließlich Kindern unter 14 Jahren und erhebt nicht absichtlich personenbezogene Daten von Kindern.</p>\n\n  <h2>8. Rechte der Nutzer</h2>\n  <p>Nutzer können jederzeit die Löschung ihrer Ranglisteneinträge verlangen und die auf dem Gerät gespeicherten Daten über die Funktion \"Fortschritt zurücksetzen\" in den App-Einstellungen löschen.</p>\n\n  <h2>9. Kontakt</h2>\n  <div class=\"card\">\n    <p style=\"margin:0\">Anfragen zum Datenschutz: <a href=\"mailto:kjinyz@naver.com\">kjinyz@naver.com</a></p>\n  </div>\n\n  <h2>10. Änderungen dieser Erklärung</h2>\n  <p>Bei Änderungen dieser Erklärung wird das Datum des Inkrafttretens aktualisiert und auf dieser Seite veröffentlicht.</p>\n\n  <footer>Finde die Regel (CatchTheRule) · Diese Erklärung gilt ab dem 4. Juni 2026.</footer>"};
const NAMES = {"en": "English", "ko": "한국어", "ja": "日本語", "zh": "简体中文", "es": "Español", "fr": "Français", "de": "Deutsch"};
function pickLang() {
  const q = new URLSearchParams(location.search).get('lang');
  const cand = (q || navigator.language || 'en').toLowerCase();
  const code = cand.startsWith('zh') ? 'zh' : cand.slice(0, 2);
  return I18N[code] ? code : 'en';
}
let cur = pickLang();
const sel = document.getElementById('lang');
Object.keys(NAMES).forEach(c => {
  const o = document.createElement('option');
  o.value = c; o.textContent = NAMES[c];
  sel.appendChild(o);
});
function render() {
  document.getElementById('content').innerHTML = I18N[cur];
  document.documentElement.lang = (cur === 'zh') ? 'zh-Hans' : cur;
  sel.value = cur;
}
sel.addEventListener('change', e => {
  cur = e.target.value; render();
  const u = new URL(location); u.searchParams.set('lang', cur);
  history.replaceState(null, '', u);
});
render();
</script>
