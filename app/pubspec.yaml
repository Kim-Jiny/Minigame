name: minigame_app
description: "Minigame collection app with online multiplayer"
publish_to: 'none'

version: 1.1.0+17

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Socket.io for real-time communication
  socket_io_client: ^3.0.3

  # State management
  provider: ^6.1.2

  # Routing
  go_router: ^14.8.1

  # Local storage
  shared_preferences: ^2.5.3

  # Social login
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  kakao_flutter_sdk_user: ^1.9.5

  # HTTP client
  http: ^1.2.2
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2

  # Ads
  google_mobile_ads: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "DUOIcon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
