name: minigame_app
description: "Minigame collection app with online multiplayer"
publish_to: 'none'

version: 1.2.0+23

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Socket.io for real-time communication
  socket_io_client: ^3.0.3

  # State management
  provider: ^6.1.2

  # Routing
  go_router: ^14.8.1

  # Local storage
  shared_preferences: ^2.5.3

  # Social login
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  kakao_flutter_sdk_user: ^1.9.5

  # HTTP client
  http: ^1.2.2
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2

  # Ads
  google_mobile_ads: ^5.3.0
  app_tracking_transparency: ^2.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "DUOIcon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # 주아체(Jua, SIL OFL) — 제목·버튼·점수 등 "게임 느낌" 텍스트에만 쓴다. 단일 굵기 파일이라
  # 모든 weight 에 같은 파일을 등록해 가짜 볼드(합성 굵기)가 생기지 않게 한다.
  fonts:
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
        - asset: assets/fonts/Jua-Regular.ttf
          weight: 700
        - asset: assets/fonts/Jua-Regular.ttf
          weight: 800
        - asset: assets/fonts/Jua-Regular.ttf
          weight: 900
