services:
  - type: web
    name: minigame-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: APPLE_BUNDLE_ID
        value: com.minigame.minigameApp
      - key: DATABASE_URL
        fromDatabase:
          name: minigame-db
          property: connectionString

databases:
  - name: minigame-db
    plan: free
    databaseName: minigame_aeki
