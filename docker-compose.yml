services:
  duo-arena:
    build: ./server
    container_name: duo-arena
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    container_name: duo-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=duo
      - POSTGRES_USER=duo
      - POSTGRES_PASSWORD=jiny1204
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duo -d duo"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    external: true