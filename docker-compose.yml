name: duo
services:
  duo-arena:
    build: ./server
    container_name: duo-arena
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - ./server/.env
    # [SAJA] 사자툰 만화 이미지 업로드 영속화 — 재배포(이미지 재빌드)에도 업로드 파일 보존.
    volumes:
      - saja_comics:/app/public/saja/comics
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    container_name: duo-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55433:5432"
    environment:
      - POSTGRES_DB=duo
      - POSTGRES_USER=duo
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duo -d duo"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

volumes:
  pgdata:
  saja_comics: # [SAJA] 사자툰 만화 이미지 업로드 영속 볼륨

networks:
  app-network:
    external: true